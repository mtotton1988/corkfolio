            line(cov.estimatedWindow.length, 'drinking windows still guessed'),
          ].filter(Boolean).join(', ') + '.'));
        kids.push(h('button', {
          key: 'covdl', style: btn('plain'),
          onClick: () => this.download(
            'corkfolio-reference-needed.txt', this.coverageBrief(cov), 'text/plain'),
        }, 'Download what is missing'));
        kids.push(h('div', { key: 'covhow', style: sx.note },
          'The file names each gap, the shape of an entry and the house rules, so it can be ' +
          'handed to a model as-is. Everything else about a new import - bottles, prices, ' +
          'windows, the timeline - is already correct without any of this.'));
      }
    }

    /* --- sync ---------------------------------------------------------
       Below the cellar and the coverage report, above Danger: it is a thing
       you set up once and then never look at, and it is not dangerous. */
    kids.push(h(Eyebrow, { key: 'e-sync' }, 'Sync'));
    if (st.syncCfg) {
      kids.push(h('div', { key: 'sync-on', style: { ...sx.panel, gap: 8 } }, [
        h('div', { key: 's', style: { fontSize: 13, color: ink(0.6) } }, [
          'Syncing to ',
          h('strong', { key: 'r', style: { fontWeight: 600, color: INK } }, st.syncCfg.repo),
          '. ',
          st.syncStatus === 'syncing' ? 'Syncing now.'
            : st.syncStatus === 'error' ? 'Last attempt failed.'
            : st.syncStatus === 'ok' ? 'Up to date.'
            : 'Not synced yet this session.',
        ]),
        st.syncHint ? h('div', { key: 'h', style: sx.note }, 'Sync failed: ' + st.syncHint + '.') : null,
        h('div', { key: 'b', style: { display: 'flex', gap: 8 } }, [
          h('button', {
            key: 'n', style: { ...btn('plain'), flex: 1 }, onClick: this.syncNow,
          }, st.syncStatus === 'syncing' ? 'Syncing...' : 'Sync now'),
          h('button', {
            key: 'd',
            style: { ...btn('plain'), flex: 1, borderColor: 'rgba(var(--claret-rgb),0.5)', color: CLARET },
            onClick: this.disconnectSync,
          }, 'Turn off'),
        ]),
      ]));
    } else if (!st.showSyncSetup) {
      kids.push(h('div', { key: 'sync-off', style: { ...sx.panel, gap: 8 } }, [
        h('p', { key: 'p', style: sx.prose },
          'Your holdings, what has come home and anything you write live on this device ' +
          'only. ' +
          'Sync keeps a copy in a private repository you own, so a second device sees the ' +
          'same cellar. Nothing is shared with anyone, and the app works exactly as well ' +
          'without it.'),
        h('button', {
          key: 'b', style: { ...btn('plain'), alignSelf: 'flex-start' },
          onClick: () => this.setState({ showSyncSetup: true }),
        }, 'Set up sync to a private repo'),
      ]));
    } else {
      kids.push(h('div', { key: 'sync-form', style: { ...sx.panel, gap: 8 } }, [
        h('p', { key: 'p', style: sx.prose },
          'Create a repository on GitHub and make it PRIVATE. Then create a fine-grained ' +
          'token with Contents set to read and write, on that repository and nothing else. ' +
          'The token is kept on this device and sent to nobody but GitHub.'),
        h('div', { key: 'w', style: sx.note },
          'Do not use the repository the app itself is published from. That one is public, ' +
          'and this file holds every bottle you own and what you paid for it.'),
        h('label', { key: 'lt', style: sx.label }, [
          h('span', { key: 'l' }, 'Access token'),
          h('input', {
            key: 'i', style: sx.input, type: 'password', autoComplete: 'off',
            autoCapitalize: 'none', spellCheck: false, value: st.tokenInput,
            onChange: e => this.setState({ tokenInput: e.target.value }),
          }),
        ]),
        h('label', { key: 'lr', style: sx.label }, [
          h('span', { key: 'l' }, 'Repository'),
          h('input', {
            key: 'i', style: sx.input, type: 'text', placeholder: 'username/corkfolio-data',
            autoComplete: 'off', autoCapitalize: 'none', spellCheck: false, value: st.repoInput,
            onChange: e => this.setState({ repoInput: e.target.value }),
          }),
        ]),
        h('div', { key: 'b', style: { display: 'flex', gap: 8 } }, [
          h('button', { key: 'c', style: { ...btn('plain'), flex: 1 }, onClick: this.connectSync },
            'Connect and sync'),
          h('button', {
            key: 'x', style: { ...btn('plain'), flex: 1 },
            onClick: () => this.setState({ showSyncSetup: false, tokenInput: '', repoInput: '' }),
          }, 'Cancel'),
        ]),
      ]));
    }

    kids.push(h(Eyebrow, { key: 'e-d' }, 'Danger'));
    kids.push(h('button', {
      key: 'w', style: { ...btn('plain'), borderColor: 'rgba(var(--claret-rgb),0.5)', color: CLARET },
      onClick: () => {
        if (!window.confirm('Erase the imported cellar from this device? ' +
          this.lots().length + ' wines. This cannot be undone, though re-importing the export restores it.')) return;
        try { localStorage.removeItem('corkfolio.lots.v1'); } catch (e) {}
        this.setState({ lots: null, sheet: null });
      },
    }, 'Erase the cellar'));

    return this.sheet('Cellar and settings', kids);
  }


  /* ================================================================ funnel

     The app is a funnel: the whole cellar, then one region, then one
     sub-region, then one wine. Each level answers the same five questions
     about a smaller set of bottles, and the way down is by tapping the thing
     you want to know more about rather than by setting a filter.

     Drill state is just two strings. There is no history stack because there
     are only three levels and a breadcrumb is clearer than a back button.
  ============================================================================ */

  /* The lots at the current level, before the readiness filter. */
  scopeLots() {
    const st = this.state;
    return this.lots().filter(l => {
      if (st.dRegion && l.region !== st.dRegion) return false;
      if (st.dSub && (l.subRegion || 'Not recognised') !== st.dSub) return false;
      return true;
    });
  }

  /* And after it. The readiness chips narrow what you are looking at without
     moving you down a level. */
  visibleLots() {
    const st = this.state;
    const y = this.year();
    return this.scopeLots().filter(l =>
      !st.fState || this.lotState(l) === st.fState);
  }

  /* The five numbers, for whatever set of lots it is handed. Cases rather than
     only bottles because that is the unit BBR sells, stores and charges in. */
  metrics(lots) {
    let bottles = 0, cases = 0, inBond = 0, atMarket = 0, taxPaid = 0, estimatedBottles = 0;
    for (const lot of lots) {
      bottles += lot.bottles;
      if (lot.caseSize) cases += lot.bottles / lot.caseSize;
      const pb = perBottle(lot), mk = marketOrPaid(lot);
      const d = deliveredPerBottle(lot, lot.bottles);
      if (pb !== null) inBond += pb * lot.bottles;
      if (mk !== null) atMarket += mk * lot.bottles;
      if (marketIsEstimated(lot)) estimatedBottles += lot.bottles;
      if (d) taxPaid += d.total * lot.bottles;
    }
    return { wines: lots.length, bottles, cases, inBond, atMarket, taxPaid, estimatedBottles };
  }

  /* A case count of 9.5 is real - a three-bottle lot out of a six-bottle case
     is half a case - so it is shown rather than rounded away. */
  caseLabel(cases) {
    return Math.abs(cases - Math.round(cases)) < 0.05
      ? String(Math.round(cases))
      : cases.toFixed(1);
  }

  metricStrip(m) {
    return [
      h('div', { key: 'stats', style: sx.statRow }, [
        h(Stat, { key: 'a', k: 'Bottles', v: String(m.bottles) }),
        h(Stat, { key: 'b', k: 'Cases', v: this.caseLabel(m.cases) }),
        h(Stat, { key: 'c', k: 'In bond', v: money0(m.inBond) }),
        h(Stat, { key: 'd', k: 'At market', v: money0(m.atMarket) }),
        h(Stat, { key: 'e', k: 'Duty paid', v: money0(m.taxPaid) }),
      ]),
    ];
  }

  breadcrumb() {
    const st = this.state;
    if (!st.dRegion) return null;
    const crumbs = [
      { label: 'All regions', go: () => this.setState({ dRegion: null, dSub: null, fState: null }) },
      { label: st.dRegion, go: () => this.setState({ dSub: null }) },
    ];
    if (st.dSub) crumbs.push({ label: st.dSub, go: null });
    return h('div', {
      key: 'crumb',
      style: {
        flexShrink: 0, display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: 6,
        fontSize: 12.5,
      },
    }, crumbs.map((c, i) => [
      i ? h('span', { key: 's' + i, style: { color: ink(0.3) } }, '›') : null,
      c.go
        ? h('button', {
            key: 'c' + i,
            style: { border: 'none', background: 'transparent', padding: 0, color: 'var(--link)', fontSize: 12.5 },
            onClick: c.go,
          }, c.label)
        : h('span', { key: 'c' + i, style: { color: ink(0.55) } }, c.label),
    ]));
  }

  /* Slices of the level below, largest first, so the donut and its legend
     agree with the order of the holdings list underneath. */
  slicesBelow(lots) {
    const st = this.state;
    const key = st.dRegion ? (l => l.subRegion || 'Not recognised') : (l => l.region);
    const groups = new Map();
    for (const l of lots) {
      const k = key(l);
      const g = groups.get(k) || { key: k, bottles: 0, region: l.region };
      g.bottles += l.bottles;
      groups.set(k, g);
    }
    /* Ordered by the thing the ring draws, so the legend reads down in the
       same order the segments run round. Sorting by cases while drawing
       bottles would put a three-bottle case above a larger holding. */
    const arr = [...groups.values()].sort((a, b) => b.bottles - a.bottles);
    /* Inside a region the segments would all be the same colour, so sub-regions
       get graded weights of the region's hue instead - the ordering carries the
       information, and the region stays recognisable one level down. */
    return arr.map((g, i) => ({
      ...g,
      colour: st.dRegion ? regionColour(g.region) : regionColour(g.key),
      /* Graded opacity rather than color-mix: opacity works everywhere, and
         color-mix needs a fairly recent Safari, which is exactly the browser
         this has to work in on a phone. */
      alpha: st.dRegion ? Math.max(0.3, 1 - i * 0.13) : 1,
    }));
  }

  /* Every list of wines is ordered by how much window is left, soonest first.
     That is the order the question "what should I drink" is actually asked in,
     and it makes the list agree with the Windows tab rather than contradicting
     it with an alphabetical or chronological order that means nothing.

     Anything with no window at all sinks to the bottom: it cannot be urgent if
     nobody knows when it is ready. */
  byClosingSoonest = (a, b) => {
    const wa = this.win(a), wb = this.win(b);
    if (!wa.to && !wb.to) return fold(a.description).localeCompare(fold(b.description));
    if (!wa.to) return 1;
    if (!wb.to) return -1;
    return (wa.to - wb.to)
      || ((wa.from || 0) - (wb.from || 0))
      || fold(a.description).localeCompare(fold(b.description));
  };



  /* ------------------------------------------------------ reference coverage

     The holdings look after themselves: import a new export and the bottles,
     valuations, windows, timeline and donut are all correct immediately,
     because they are computed from the file. What does NOT look after itself
     is the written layer - the estate notes, the vintage notes, the region
     essays, the maps. A wine from an estate the app has never heard of still
     appears everywhere and prices correctly; it just has nothing to say about
     itself, and it says nothing quietly.

     Quietly is the problem. This turns that silence into a worklist: exactly
     which estates, region-vintages, appellations and regions are unknown, so
     the gap is visible the moment it appears rather than the day you happen
     to tap the wrong wine.
  -------------------------------------------------------------------------- */

  coverage() {
    const lots = this.lots();
    const st = this.state;
    const wines = (st.ref && st.ref.wines) || [];
    const vintages = (st.ref && st.ref.vintages) || {};
    const out = {
      lots: lots.length,
      noEstate: [], noVintage: [], noSubRegion: [], noRegion: [], noMap: [], estimatedWindow: [],
      ready: !!st.ref,
    };
    if (!st.ref) return out;

    const seenVintage = new Set();
    const seenRegion = new Set();

    for (const lot of lots) {
      if (!matchWine(lot, wines)) out.noEstate.push(lot.vintage + ' ' + shortName(lot));

      const rv = lot.region + ' ' + lot.vintage;
      if (!matchVintage(lot, vintages) && !seenVintage.has(rv)) {
        seenVintage.add(rv);
        out.noVintage.push(rv);
      }

      if (!lot.subRegion) out.noSubRegion.push(lot.vintage + ' ' + shortName(lot));

      if (lot.region && !seenRegion.has(lot.region)) {
        seenRegion.add(lot.region);
        if (!mapFor(st.regionNotes, lot.region)) out.noRegion.push(lot.region);
        if (!mapFor(st.maps, lot.region)) out.noMap.push(lot.region);
      }

      if (windowIsEstimated(this.win(lot))) out.estimatedWindow.push(lot.vintage + ' ' + shortName(lot));
    }
    out.complete = !out.noEstate.length && !out.noVintage.length && !out.noSubRegion.length
      && !out.noRegion.length && !out.noMap.length && !out.estimatedWindow.length;
    return out;
  }

  /* A brief the next import can be handed straight to a model. It names the
     files, the exact shape of an entry and the house rules, because the thing
     that makes reference content go bad is not effort - it is drift in voice
     and the slow arrival of invented facts. */
  coverageBrief(c) {
    const L = [];
    L.push('CORKFOLIO - reference content still needed');
    L.push('');
    L.push('The app reads four reference files. Each is keyed independently, and a wine with');
    L.push('no entry still works - it simply has nothing to say. Below is what is missing.');
    L.push('');
    if (c.noEstate.length) {
      L.push('## wines.json - no estate note (' + c.noEstate.length + ')');
      L.push('Add one object per estate to the "wines" array. Fields: slug, match (array of');
      L.push('lowercase substrings that must ALL appear in the BBR description), name, say,');
      L.push('appellation, rank, grapes, estate, producer, style, drink.');
      L.push('"say" is how to pronounce the distinctive part of the name - syllables');
      L.push('hyphenated, the stressed one capitalised, as in "oh bye-YEE". Do not spell out');
      L.push('"Chateau" or "Domaine", and leave the field out altogether where an English');
      L.push('speaker would get the name right unaided.');
      c.noEstate.forEach(x => L.push('  - ' + x));
      L.push('');
    }
    if (c.noVintage.length) {
      L.push('## vintages.json - no vintage note (' + c.noVintage.length + ')');
      L.push('Keyed vintages[region][year], with headline, note and now.');
      c.noVintage.forEach(x => L.push('  - ' + x));
      L.push('');
    }
    if (c.noRegion.length) {
      L.push('## regions.json - region never described (' + c.noRegion.length + ')');
      L.push('Needs headline, character, structure, interest, a notable array of');
      L.push('{name, why}, and pronunciations for any appellation an English speaker');
      L.push('would get wrong.');
      c.noRegion.forEach(x => L.push('  - ' + x));
      L.push('');
    }
    if (c.noMap.length) {
      L.push('## maps.json - no map geometry (' + c.noMap.length + ')');
      L.push('Needs water, land, appellations, towns and areas on a 0-100 grid, north up.');
      c.noMap.forEach(x => L.push('  - ' + x));
      L.push('');
    }
    if (c.noSubRegion.length) {
      L.push('## SUBREGIONS in index.html - appellation not recognised (' + c.noSubRegion.length + ')');
      L.push('Add [name, [match keywords]] to the SUBREGIONS table. Until then these wines');
      L.push('group under "Not recognised" in the donut and cannot be placed on a map.');
      c.noSubRegion.forEach(x => L.push('  - ' + x));
      L.push('');
    }
    if (c.estimatedWindow.length) {
      L.push('## windows.json - drinking window is a guess (' + c.estimatedWindow.length + ')');
      L.push('The export states no window and none has been researched, so the app is');
      L.push('estimating from vintage and sub-region. Entries take match, vintage, from, to,');
      L.push('confidence, basis and sources.');
      c.estimatedWindow.forEach(x => L.push('  - ' + x));
      L.push('');
    }
    L.push('## House rules');
    L.push('- Plain British English. No exclamation marks, no marketing language.');
    L.push('- NEVER a critic score, a points number or a price. That is deliberate.');
    L.push('- Durable facts only: terroir, grapes, classification, house style, how it drinks.');
    L.push('  Avoid anything that goes stale, such as who the current winemaker is, unless');
    L.push('  it is well established.');
    L.push('- Where sources disagree, say so rather than picking a side.');
    L.push('- If a fact cannot be verified, leave it out. A shorter true note beats a longer one.');
    return L.join('\n');
  }

  /* ---------------------------------------------------- shape of a region

     Both boxes are computed from the holdings rather than written down. A
     written summary is wrong the day after the next case arrives, and the
     whole point of these two panels is that they describe THIS cellar. The
     only authored input is the notable list in regions.json - what a rounded
     holding in the region would draw on - and the gaps are that list minus
     what is owned, plus whatever the numbers themselves say.
  ------------------------------------------------------------------------ */

  regionShape(lots) {
    const y = this.year();
    const bottles = lots.reduce((a, l) => a + l.bottles, 0);
    const subs = new Map();
    const vintages = new Map();
    const producers = new Map();
    const wines = new Map();
    let cost = 0, priced = 0, lo = Infinity, hi = 0;

    for (const l of lots) {
      const sub = l.subRegion || 'unnamed';
      const s = subs.get(sub) || { bottles: 0 };
      s.bottles += l.bottles;
      subs.set(sub, s);

      if (l.vintage) vintages.set(l.vintage, (vintages.get(l.vintage) || 0) + l.bottles);
      const prod = (this.state.notes[l.key] || {}).producer || l.producer;
      if (prod) producers.set(prod, (producers.get(prod) || 0) + l.bottles);

      /* A vertical is the same wine in more than one vintage. */
      const key = fold(shortName(l));
      if (!wines.has(key)) wines.set(key, { name: shortName(l), vintages: new Set() });
      wines.get(key).vintages.add(l.vintage);

      const pb = perBottle(l);
      if (pb !== null) { cost += pb * l.bottles; priced += l.bottles; lo = Math.min(lo, pb); hi = Math.max(hi, pb); }
    }

    const state = { closing: 0, past: 0, prime: 0, opening: 0, young: 0, unknown: 0 };
    for (const l of lots) state[this.lotState(l)] += l.bottles;

    const rank = m => [...m.entries()].sort((a, b) =>
      (b[1].bottles !== undefined ? b[1].bottles : b[1]) - (a[1].bottles !== undefined ? a[1].bottles : a[1]));

    return {
      lots: lots.length, bottles,
      subs: rank(subs), vintages: rank(vintages), producers: rank(producers),
      verticals: [...wines.values()].filter(w => w.vintages.size > 1),
      avg: priced ? cost / priced : null,
      lo: lo === Infinity ? null : lo, hi: hi || null,
      state, year: y,
      drinkable: state.opening + state.prime + state.closing + state.past,
    };
  }

  /* Sentences rather than a table: the shape of a holding is a set of
     relationships, and a table of the same numbers is already above on the
     page. Each line only appears if it has something to say. */
  cellarSummary(region, lots) {
    const s = this.regionShape(lots);
    const out = [];
    const pl = (n, one, many) => n + ' ' + (n === 1 ? one : (many || one + 's'));

    const named = s.subs.filter(([k]) => k !== 'unnamed');
    out.push(pl(s.lots, 'wine') + ' and ' + pl(s.bottles, 'bottle') +
      (named.length ? ', across ' + pl(named.length, 'appellation') : '') + '.');

    if (named.length) {
      const top = named.slice(0, 3);
      const share = top.reduce((a, x) => a + x[1].bottles, 0) / s.bottles;
      out.push(top.length === 1
        ? 'All of it is ' + top[0][0] + '.'
        : 'Weighted towards ' + listOf(top.map(x => x[0])) + ', which together hold ' +
          Math.round(share * 100) + '% of it.');
      if (named.length > 3) {
        const thin = named.filter(x => x[1].bottles <= 6).map(x => x[0]);
        if (thin.length) out.push('Only a token holding in ' + listOf(thin) + '.');
      }
    }

    if (s.vintages.length) {
      const years = s.vintages.map(v => v[0]).sort();
      const top = s.vintages[0];
      out.push('Vintages run ' + years[0] + ' to ' + years[years.length - 1] +
        ', with ' + top[0] + ' the deepest at ' + pl(top[1], 'bottle') +
        ' (' + Math.round(top[1] / s.bottles * 100) + '%).');
    }

    if (s.avg !== null) {
      out.push('Averaging ' + money(s.avg) + ' a bottle in bond, from ' +
        money(s.lo) + ' to ' + money(s.hi) + '.');
    }

    const ready = s.drinkable;
    out.push(pl(ready, 'bottle') + ' of ' + s.bottles + ' already drinkable' +
      (s.state.closing ? ', and ' + pl(s.state.closing, 'bottle') + ' with three years or less of window left' : '') + '.');

    if (s.verticals.length) {
      out.push('Verticals of ' + listOf(s.verticals.slice(0, 4).map(v =>
        v.name + ' (' + [...v.vintages].sort().join(', ') + ')')) + '.');
    }

    const repeat = s.producers.filter(p => p[1] >= 12).slice(0, 4).map(p => p[0]);
    if (repeat.length) out.push('Deepest with ' + listOf(repeat) + '.');

    return out;
  }

  cellarGaps(region, lots, note) {
    const s = this.regionShape(lots);
    const held = new Set(lots.map(l => fold(l.subRegion || '')).filter(Boolean));
    const out = [];

    /* Appellations the region is known for that this cellar has none of. */
    const missing = ((note && note.notable) || []).filter(n => !held.has(fold(n.name)));
    for (const m of missing.slice(0, 5)) out.push({ head: m.name, body: m.why });

    /* Then what the numbers themselves say, which no list can know. */
    if (s.vintages.length) {
      const top = s.vintages[0];
      const share = top[1] / s.bottles;
      if (share > 0.33 && s.vintages.length > 2) {
        out.push({
          head: 'Vintage concentration',
          body: Math.round(share * 100) + '% of this region is ' + top[0] +
            '. A single year going wrong, or simply maturing all at once, takes a third of the holding with it.',
        });
      }
    }

    const later = s.state.young;
    if (s.bottles >= 12 && later / s.bottles < 0.15) {
      out.push({
        head: 'Nothing held back',
        body: 'Only ' + later + ' of ' + s.bottles + ' bottles are still short of their window. ' +
          'Everything here is drinkable now, which means nothing is being kept for the 2030s.',
      });
    }

    if (s.avg !== null && s.hi && s.lo && s.hi / s.lo < 2.2 && s.lots >= 6) {
      out.push({
        head: 'A narrow price band',
        body: 'Everything sits between ' + money(s.lo) + ' and ' + money(s.hi) + ' a bottle. ' +
          'No cheap weeknight bottle and nothing at the top end either.',
      });
    }

    if (!out.length) {
      out.push((note && note.notable && note.notable.length)
        ? {
            head: 'Nothing obvious',
            body: 'This region is well spread across its appellations, its vintages and its price range.',
          }
        : {
            head: 'Not assessed',
            body: 'Corkfolio has no reference notes for ' + region + ' yet, so it has nothing to ' +
              'compare your holding against. Silence here means the app does not know, not that ' +
              'there is nothing to find.',
          });
    }
    return out;
  }

  /* Readiness as a filter, not as a way down a level. Shared by both tabs so
     the counts and the behaviour cannot drift apart. Returns null rather than
     an empty row when there is only one state to show. */
  readinessChips(lots) {
    const st = this.state;
    const y = this.year();
    const counts = new Map();
    for (const l of lots) {
      const k = this.lotState(l);
      counts.set(k, (counts.get(k) || 0) + l.bottles);
    }
    if (counts.size < 2) return null;
    return h('div', { key: 'chips', style: sx.chipRow }, this.readinessChipList(lots));
  }

  /* The chips themselves, unwrapped, so the Wines tab can put them in a row
     shared with the location pair while the Cellar tab keeps its own. */
  readinessChipList(lots) {
    const st = this.state;
    const counts = new Map();
    for (const l of lots) {
      const k = this.lotState(l);
      counts.set(k, (counts.get(k) || 0) + l.bottles);
    }
    if (counts.size < 2) return [];
    return STATE_ORDER.filter(k => counts.has(k)).map(k => h('button', {
        key: k, style: chip(st.fState === k),
        onClick: () => this.setState({ fState: st.fState === k ? null : k }),
      }, [
        h('span', {
          key: 'd', className: 'm-state',
          style: {
            display: 'inline-block', width: 7, height: 7, borderRadius: 4, marginRight: 6,
            background: STATES[k].colour,
          },
        }),
        /* No bottle count on these. Six labelled chips came to 706 points of
           width against the 343 a phone row has, which wraps to three lines
           however they are grouped - and three lines of filters above a list
           of four visible wines is the wrong way round. The counts live on the
           Cellar screen, where the numbers are the point; here the chip is a
           filter, and the list underneath says how many. */
        STATES[k].name,
      ]));
  }

  /* In-bond against Home/Consumed. Always one or the other, and always
     visible even at zero, because the pair is the label for what the list
     below is: a row of chips where nothing is selected reads as "no filter",
     and here there is no such state. The dot is square rather than round, so
     the eye can tell this row's two chips from the four round maturity ones
     without reading them. */
  /* The two location chips and the four readiness chips are ONE wrapping row,
     not two stacked ones. At 320 points - which is what an iPhone reports with
     Display Zoom set to Larger Text - two rows wrapped to three lines and the
     furniture above the list came to 47% of the screen, leaving under four
     wines visible. One row wraps to two lines and reads better besides: these
     are all filters on the same list, and stacking them implied a hierarchy
     that is not there. The count goes on the end of the same row rather than
     taking a line of its own. */
  filterChips(scoped, visible) {
    return h('div', {
      key: 'chips',
      style: { ...sx.chipRow, alignItems: 'center' },
    }, [
      ...this.whereChips(scoped),
      ...(this.state.fWhere === 'home' ? [] : this.readinessChipList(scoped)),
      visible ? h('span', {
        key: 'n',
        style: {
          fontSize: 10.5, letterSpacing: '0.12em', textTransform: 'uppercase',
          color: ink(0.5), fontWeight: 600, marginLeft: 'auto', paddingLeft: 4,
        },
      }, visible.length === scoped.length
        ? visible.length + (visible.length === 1 ? ' wine' : ' wines')
        : visible.length + ' of ' + scoped.length) : null,
    ]);
  }

  whereChips(scoped) {
    const st = this.state;
    const bond = scoped.reduce((a, l) => a + l.bottles, 0);
    const home = this.scopedHistory().reduce((a, e) => a + e.bottles, 0);
    const opts = [
      { k: 'bond', label: 'In-bond', n: bond, colour: ink(0.45) },
      { k: 'home', label: 'Home/Consumed', n: home, colour: 'var(--hist)' },
    ];
    return opts.map(o => h('button', {
      key: o.k, style: chip(st.fWhere === o.k),
      /* Switching clears the readiness filter: a count taken from one set
         means nothing about the other, and leaving "Closing" lit while the
         list changed underneath it was the confusing version of this. */
      onClick: () => this.setState({ fWhere: o.k, fState: null }),
    }, [
      h('span', {
        key: 'd',
        style: {
          display: 'inline-block', width: 7, height: 7, borderRadius: 2, marginRight: 6,
          background: o.colour,
        },
      }),
      o.label,
      h('span', { key: 'n', className: 'm-num', style: { opacity: 0.6, marginLeft: 5 } },
        String(o.n)),
    ]));
  }

  /* The whole cellar's drinking windows, on their own. Deliberately not tied
     to where you are in the funnel: the question this tab answers - what is
     ready and what is closing - is about the cellar, not about Pauillac. */
  renderWindowsTab() {
    const lots = this.lots();
    const visible = this.state.fState
      ? lots.filter(l => this.lotState(l) === this.state.fState)
      : lots;
    const out = [];
    out.push(h('div', {
      key: 'h', style: { ...sx.title, fontSize: 20, flex: 'none', flexShrink: 0 },
    }, 'Drinking Windows'));
    out.push(this.readinessChips(lots));
    if (!visible.length) {
      out.push(h('div', { key: 'none', style: sx.empty }, 'Nothing here matches that.'));
      return out;
    }
    out.push(...this.renderWindows(visible));
    return out;
  }

  /* Place names in this cellar are mostly French and mostly not pronounced the
     way they are spelled. The respelling sits beside the heading rather than
     in a tooltip, because the moment you want it is the moment you are looking
     at the name - and on a phone there is no hover to reveal anything.

     Absent for anywhere an English speaker already says correctly, so the line
     stays quiet on Burgundy and Piedmont and only speaks where it helps. */
  placeHeading(name) {
    const say = this.state.saying ? mapFor(this.state.saying, name) : null;
    return h('div', {
      key: 'h',
      style: {
        flexShrink: 0, display: 'flex', alignItems: 'baseline',
        flexWrap: 'wrap', gap: '0 10px',
      },
    }, [
      h('span', { key: 'n', style: { ...sx.title, fontSize: 20, flex: 'none' } }, name),
      say ? h('span', {
        key: 's',
        style: {
          fontFamily: "'Newsreader',Georgia,serif", fontStyle: 'italic',
          fontSize: 14, color: ink(0.45), letterSpacing: '0.01em',
        },
      }, say) : null,
    ]);
  }

  renderFunnelPage() {
    const st = this.state;
    const out = [];
    const scoped = this.scopeLots();
    const visible = this.visibleLots();
    const crumb = this.breadcrumb();
    if (crumb) out.push(crumb);

    out.push(this.placeHeading(st.dSub || st.dRegion || 'Cellar Overview'));

    /* The numbers and the donut answer to the readiness chips, not just to the
       drill level. With no list on this tab the chips would otherwise do
       nothing visible; this way "Closing" redraws the split as the shape of
       what is actually running out. */
    out.push(...this.metricStrip(this.metrics(visible)));

    if (!st.dSub) {
      const slices = this.slicesBelow(visible);
      const totalBottles = slices.reduce((a, s) => a + s.bottles, 0);
      if (slices.length > 1) {
        out.push(h(Eyebrow, { key: 'e-d' },
          st.dRegion ? 'Bottles by sub-region' : 'Bottles by region'));
        out.push(h(Donut, {
          key: 'donut', slices, total: totalBottles,
          centreTop: String(totalBottles), centreBottom: 'bottles',
          /* A region opens another donut. A sub-region has no level below it
             but the bottles themselves, so it hands over to the Wines tab -
             that is the bottom of the funnel. */
          onPick: k => st.dRegion
            ? this.setState({ dSub: k, tab: 'wines' })
            : this.setState({ dRegion: k }),
        }));
      }
    }

    /* The region essay, under the donut. Only at region level: the overview
       has no one region to describe, and a sub-region page is already about
       somewhere specific enough that a general essay would be noise. */
    if (st.dRegion && !st.dSub) {
      const note = mapFor(st.regionNotes, st.dRegion);
      if (note) {
        out.push(h(Eyebrow, { key: 'e-about' }, 'About ' + st.dRegion));
        out.push(h('div', { key: 'about', style: { ...sx.card, background: PLATE } }, [
          note.headline ? h('p', {
            key: 'hl',
            style: { ...sx.prose, fontStyle: 'italic', color: ink(0.66), marginBottom: 2 },
          }, note.headline) : null,
          ...['character', 'structure', 'interest']
            .filter(k => note[k])
            .map(k => h('p', { key: k, style: sx.prose }, note[k])),
        ]));
      }

      /* What you have here, and what you have not. Both computed from the
         holdings, so neither can go stale the day a case arrives. */
      const summary = this.cellarSummary(st.dRegion, scoped);
      if (summary.length) {
        out.push(h(Eyebrow, { key: 'e-mine' }, 'In your cellar'));
        out.push(h('div', { key: 'mine', style: { ...sx.card, background: PLATE } },
          summary.map((line, i) => h('p', { key: i, style: sx.prose }, line))));
      }

      const gaps = this.cellarGaps(st.dRegion, scoped, note);
      if (gaps.length) {
        out.push(h(Eyebrow, { key: 'e-gaps' }, 'Gaps'));
        out.push(h('div', {
          key: 'gaps',
          style: { ...sx.card, background: PLATE, gap: 11 },
        }, gaps.map(g => h('div', {
          key: g.head,
          style: { display: 'flex', flexDirection: 'column', gap: 2 },
        }, [
          h('div', {
            key: 'h',
            style: { fontSize: 13.5, fontWeight: 600, color: CLARET },
          }, g.head),
          h('p', { key: 'b', style: { ...sx.prose, fontSize: 15 } }, g.body),
        ]))));
      }
    }

    out.push(this.readinessChips(scoped));

    if (!visible.length) {
      out.push(h('div', { key: 'none', style: sx.empty }, 'Nothing here matches that.'));
      return out;
    }

    out.push(h('button', {
      key: 'see', style: { ...btn('plain'), alignSelf: 'flex-start', flexShrink: 0 },
      onClick: () => this.setState({ tab: 'wines' }),
    }, 'See the ' + visible.length + (visible.length === 1 ? ' wine' : ' wines')));

    /* History belongs here rather than buried in Settings: this is the screen
       showing what the cellar is worth, and "what happened to that case" is a
       question you ask while looking at a total it is deliberately left out
       of.

       Scoped to wherever you are in the funnel, not whole-cellar. It was
       whole-cellar while history was nearly empty and the difference did not
       show; the home cellar export filled it, and a Rhone page saying nothing
       about the thirty Rhone bottles at home was simply wrong. Still only
       drawn when there is something to say, so it costs nothing on a region
       with none. */
    const scopedHist = this.scopedHistory();
    const scopedBottles = scopedHist.reduce((a, e) => a + e.bottles, 0);
    if (scopedBottles) {
      out.push(h('button', {
        key: 'hist', style: { ...btn('plain'), alignSelf: 'flex-start', flexShrink: 0 },
        onClick: () => this.setState({ sheet: 'history' }),
      }, scopedBottles + (scopedBottles === 1 ? ' bottle' : ' bottles') + ' at home or consumed'));
    }
    return out;
  }

  /* The bottom of the funnel: the holdings themselves, carrying whatever
     region, sub-region and readiness you arrived with. */
  renderWinesTab() {
    const st = this.state;
    const out = [];
    const scoped = this.scopeLots();
    const visible = this.visibleLots();
    const crumb = this.breadcrumb();
    if (crumb) out.push(crumb);

    /* No heading at the top level: the tab bar already says Wines, and at 320
       points that line was 30 of the 47% of screen the furniture was eating.
       Drilled into a region it stays, because there it names the place and
       carries its pronunciation, which is worth the room. */
    if (st.dSub || st.dRegion) out.push(this.placeHeading(st.dSub || st.dRegion));

    out.push(this.filterChips(scoped, st.fWhere === 'home' ? null : visible));

    /* --- what has come home ------------------------------------------- */
    if (st.fWhere === 'home') {
      const past = this.scopedHistory()
        .map((e, i) => ({ e, i: this.state.history.indexOf(e) }))
        .sort((a, b) => b.e.at - a.e.at);
      if (!past.length) {
        out.push(h('div', { key: 'none', style: sx.empty },
          st.dRegion
            ? 'Nothing from here has left bond yet.'
            : 'Nothing has left bond yet. Bottles arrive here when they stop appearing in the export.'));
        return out;
      }
      const bottles = past.reduce((a, x) => a + x.e.bottles, 0);
      out.push(h(Eyebrow, { key: 'e-h' },
        bottles + (bottles === 1 ? ' bottle' : ' bottles') + ', most recent first'));
      out.push(...past.map(({ e, i }) => this.historyRow(e, i)));
      return out;
    }

    /* --- what is still in bond ---------------------------------------- */
    if (!visible.length) {
      out.push(h('div', { key: 'none', style: sx.empty }, 'Nothing here matches that.'));
      return out;
    }

    out.push(...visible.slice()
      .sort(this.byClosingSoonest)
      .map(l => this.lotRow(l)));
    return out;
  }

  renderSearchResults() {
    const q = fold(this.state.fQuery);
    const term = l =>
      fold(l.description + ' ' + (l.producer || '') + ' ' + (l.subRegion || '') + ' ' + l.vintage);
    const hits = this.lots().filter(l => term(l).includes(q));

    /* A bottle you have drunk is still a bottle you might look for - more so,
       arguably, since the app is the only place that remembers it. So history
       is searched too, and always sits below every live hit: the question
       "have I got any" is answered by the cellar, and "did I have any" by what
       follows it. It is deliberately left out of the five numbers above; those
       count what you hold. */
    const past = this.state.history
      .map((e, i) => ({ e, i }))
      .filter(({ e }) => term(e).includes(q))
      .sort((a, b) => b.e.at - a.e.at);

    const out = [];
    out.push(h(Eyebrow, { key: 'e' },
      hits.length ? hits.length + (hits.length === 1 ? ' wine' : ' wines') + ' match'
        : past.length ? 'Nothing in the cellar matches'
        : 'Nothing matches'));
    if (!hits.length && !past.length) {
      out.push(h('div', { key: 'n', style: sx.empty },
        'Search looks at the wine name, the producer, the sub-region and the vintage.'));
      return out;
    }
    if (hits.length) {
      out.push(...this.metricStrip(this.metrics(hits)));
      out.push(...hits.slice()
        .sort(this.byClosingSoonest)
        .map(l => this.lotRow(l)));
    }
    out.push(...past.map(({ e, i }) => this.historyRow(e, i)));
    return out;
  }

  /* =============================================================== render */

  render() {
    const st = this.state;
    if (st.lots === undefined) return h('div', { style: sx.shell });

    const lots = this.lots();
    const searching = !!st.fQuery.trim();
    const body = [];

    if (!lots.length) {
      body.push(this.renderEmpty());
    } else {
      body.push(h('input', {
        key: 'q', style: sx.input, value: st.fQuery,
        placeholder: 'Search the cellar',
        onChange: e => this.setState({ fQuery: e.target.value }),
      }));
      body.push(...(searching
        ? this.renderSearchResults()
        : st.tab === 'windows' ? this.renderWindowsTab()
        : st.tab === 'wines' ? this.renderWinesTab()
        : this.renderFunnelPage()));
    }

    return h('div', { style: sx.shell }, [
      (st.dRegion && st.tab !== 'windows' && !searching)
        ? h(RegionMap, {
            key: 'wm', region: st.dRegion,
            map: mapFor(st.maps, st.dRegion),
            held: heldPlaces(this.scopeLots()),
          })
        : null,
      h('div', { key: 'hd', style: sx.header }, [
        h(Wordmark, { key: 't', onHome: this.goHome }),
        h('button', {
          key: 'b', style: btn('plain'),
          onClick: () => this.setState({ sheet: 'settings' }),
        }, 'Settings'),
      ]),
      h('div', { key: 'bd', style: sx.body }, body),
      /* The tab bar only appears once there is a cellar - with nothing
         imported both tabs would show the same empty state. */
      lots.length ? h('div', { key: 'tabs', style: sx.tabs },
        [['cellar', 'Cellar'], ['wines', 'Wines'], ['windows', 'Windows']].map(([k, label]) =>
          h('button', {
            key: k, style: tabStyle(st.tab === k),
            /* Cellar and Wines are two views of the same drill scope, so the
               readiness filter carries between them - that is the funnel
               working. Windows is the whole cellar, so its counts would not
               match a filter set elsewhere. */
            onClick: () => this.setState(
              k === 'windows' || st.tab === 'windows'
                ? { tab: k, fState: null, fQuery: '', fWhere: 'bond' }
                : { tab: k, fQuery: '' }),
          }, label))) : null,
      st.busy ? h('div', { key: 'busy', style: sx.toast }, st.busy) : null,
      st.toastMsg && !st.busy ? h('div', { key: 'toast', style: sx.toast }, st.toastMsg) : null,
      st.sheet === 'lot' ? h('div', { key: 'sh' }, this.renderLotSheet()) : null,
      st.sheet === 'settings' ? h('div', { key: 'sh' }, this.renderSettingsSheet()) : null,
      st.sheet === 'history' ? h('div', { key: 'sh' }, this.renderHistorySheet()) : null,
    ]);
  }
}

/* ------------------------------------------------------------------- mount */

ReactDOM.render(h(App), document.getElementById('root'));

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {
      /* No worker means no offline copy. The app still runs, so this is not
         worth interrupting anyone about - it happens on file:// by design. */
    });
  });
}
</script>
</body>
</html>
