  /* ----------------------------------------------------------------- colour
     Daylight, and only daylight. There was an evening palette here, chosen by
     the system preference or by hand from Settings; it was removed on 24
     August because one set of colours is one set to get right. Every colour
     still resolves through these variables rather than being written into a
     style object, which is worth keeping whether or not a second palette ever
     comes back.

     Contrast was measured rather than eyeballed - see the README. */
  :root{
    --ink:#211c19;        --ink-rgb:33,28,25;
    --paper:#f6f2ec;      --paper-rgb:246,242,236;
    --card:#fffdf9;      --card-rgb:255,253,249;
    --band:#ece5da;
    --claret:#8c2f3a;     --claret-rgb:140,47,58;
    --link:#8a5a2f;

    --shadow-soft:0 1px 2px rgba(33,28,25,0.05);
    --shadow-sheet:0 -6px 18px rgba(33,28,25,0.08);
    --scrim:rgba(33,28,25,0.35);
    --surface:var(--paper);
    /* Five maturity states, not BBR's four, because "closing" is the one that
       should make you act and BBR does not distinguish it. */
    --st-young:#5c7d93;
    --st-opening:#5f8a5b;
    --st-prime:#a8762c;
    --st-closing:#b4552f;
    --st-past:#8c2f3a;
    --st-unknown:#857c70;
    /* Region colours for the timeline. Chosen to be distinguishable from each
       other AND from the state colours, which appear alongside them. */
    /* Burgundy is burgundy - the one region whose name is already a colour,
       so anything else there reads as a mistake. Bordeaux takes the deep
       estuary blue of the Gironde instead: it is the largest holding and needs
       to be unmistakable, and blue against wine-red is the strongest pair in
       the set. The rest follow their own landscape - southern rust for the
       Rhone, vine-green for Piedmont, straw gold for Champagne.

       Measured against the card: every one clears the 3:1 a filled shape
       needs. Champagne was a lighter gold and reached only 2.83:1 on paper, so
       it was darkened. */
    --rg-bordeaux:#33465e;
    --rg-burgundy:#6e1b32;
    --rg-rhone:#a85a2e;
    --rg-piedmont:#6e8a4a;
    --rg-champagne:#8a7328;
    --rg-other:#9a8e80;
    /* History. The same wine red as the Burgundy region marker, and that is a
       coincidence rather than a statement: this one is a wash across a whole
       tile rather than a 3px swatch, and the word HISTORY on the tile carries
       the meaning. Named separately so that changing one never quietly
       changes the other. */
    --hist:#6e1b32;
    --hist-wash:rgba(110,27,50,0.09);

<script>
/* ============================================================================
   CORKFOLIO - see what you have, and learn about it.

   One screen with three illustrations of the same cellar:

     Windows   every lot drawn as a bar across its drinking window, with a line
               for today. What is ready, what is not yet, what is closing and
               what has gone past reads off the page without a legend.
     Regions   where the cellar actually is, by bottles and by price paid
     Vintages  the shape of the cellar by year

   Tap any wine for the estate, the producer, how it tastes, the character of
   that vintage - and the duty-paid delivered price of one bottle, which is the
   only price that matters when the cellar exists to be drunk.

   No build step. Edit this file and push. Plain React via createElement.

   ---------------------------------------------------------------------------
   localStorage keys - NEVER RENAME ONE. Existing data becomes unreachable.

     corkfolio.lots.v1        the cellar as last imported from BBR. FACTS:
                              replaced wholesale by each import, never edited
                              by hand.
     corkfolio.notes.v1       OPINIONS, one per lot key. Nothing writes to this
                              yet; the key exists so the importer can already
                              read a pinned window and a corrected producer,
                              and so the shape is fixed before there is data in
                              it to migrate.
     corkfolio.sync.v1        { token, repo } for GitHub sync, if it is set up.
                              Device-only and never synced anywhere itself.
     corkfolio.history-deleted.v1
                              tombstones: history entries removed by hand, so
                              a removal survives a sync instead of being
                              pushed back by the other device.
     corkfolio.history.v1     WHAT HAS LEFT BOND. Shown as "Home and consumed",
                              and called `history` in the code and in this key
                              because a storage key can never be renamed
                              without orphaning the data already under it. The
                              label is free to change; the key is not. Bottles that were in one export
                              and not the next, which means they were pulled
                              from bond for drinking. Accumulated by the app -
                              neither BBR nor you typed it, it comes from
                              noticing a difference between two imports - so
                              it cannot live in lots, which every import
                              replaces wholesale. Never counted in a total.
     corkfolio.prefs.v1       NOTHING, now. It held the theme and the delivery
                              charge, and both went on 24 August. The app no
                              longer reads or writes it; a copy may still sit
                              on a device from an earlier version, which is
                              harmless. Do not reuse the name for something
                              with a different shape.
     corkfolio.preupgrade.v1  a one-off copy, taken the first time a new
                              version of the app runs. Written once, never
                              overwritten.

   Reference content lives in wines.json and vintages.json in this repo. It is
   general knowledge about estates and vintages, not personal data, so it is
   public and shipped with the app - which also means it works offline and
   costs no request. Nothing leaves the device: no CDN, no analytics, no API.
============================================================================ */

const h = React.createElement;

const INK = 'var(--ink)';
const PAPER = 'var(--paper)';
const CARD = 'var(--card)';
const CLARET = 'var(--claret)';
const ink = a => 'rgba(var(--ink-rgb),' + a + ')';

/* =========================================================================
   Constants. Every one that looks arbitrary has a sentence saying what
   happens at other values.
========================================================================= */

const PRE_UPGRADE_KEY = 'corkfolio.preupgrade.v1';
const HISTORY_KEY = 'corkfolio.history.v1';
/* Which home export was last read. Provenance only - the entries
   themselves live in history, and this is what Settings reports. */
const HOME_SOURCE_KEY = 'corkfolio.home-source.v1';
const DELETED_KEY = 'corkfolio.history-deleted.v1';
const SYNC_KEY = 'corkfolio.sync.v1';

/* Community tasting notes live on CellarTracker, which has thousands of them
   per wine and is the one thing a reference file written by anybody cannot be:
   other people, drinking the same bottle, over years.

   This is a LINK, not a request. The app fetches nothing from CellarTracker
   and could not if it wanted to - they block automated readers, which is why
   scraping them was rejected long ago. Tapping it hands the wine's name to a
   new browser tab, the way typing it into the search box would.

   Kept as one constant because the URL is UNVERIFIED. CellarTracker answered
   an automated check with a bot wall rather than a page, so the search path
   below is from knowledge rather than from a test. If the button lands
   somewhere unhelpful, this line is the fix - not a hunt through the sheet. */
const CT_SEARCH = 'https://www.cellartracker.com/list.asp?szSearch=';

/* Wine-Searcher's find path, which takes the wine as plus-separated words, then
   the vintage, then a country for the prices. `uk` because that is where these
   bottles would be delivered and a dollar price answers nobody's question here.

   UNVERIFIED, and deliberately untested: Wine-Searcher prohibits automated
   access and CellarTracker answered the equivalent check with a bot wall, so
   loading this to see what came back would have been both rude and unlikely to
   tell the truth about what a phone sees. Same rule as CT_SEARCH - if the
   button lands somewhere unhelpful, this line is the fix. */
const WS_FIND = 'https://www.wine-searcher.com/find/';
const WS_COUNTRY = 'uk';

function wineSearcherUrl(lot, wine) {
  const name = wine ? wine.name : shortName(lot);
  const slug = fold(name)
    .replace(/[^a-z0-9]+/g, '+').replace(/^\++|\++$/g, '');
  return WS_FIND + slug + (lot.vintage ? '/' + encodeURIComponent(lot.vintage) : '') +
    '/' + WS_COUNTRY;
}

/* Producer, cuvee and vintage, in that order, with the accents folded off:
   the point is a search term other people's notes will match, and an
   apostrophe or a circumflex in a query string helps nobody. */
function communityNotesUrl(lot, wine) {
  const name = wine ? wine.name : shortName(lot);
  const terms = fold(name + ' ' + (lot.vintage || ''))
    .replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
  return CT_SEARCH + encodeURIComponent(terms);
}

/* The file the sync reads and writes, in a repo you own. One file, not one per
   thing: the whole cellar is a few hundred kilobytes of text, and a single
   file means a single sha to race on rather than four. */
const GH_FILE = 'cellar.json';

/* How long a removed history entry keeps overriding what a sync finds. Without
   tombstones a "not drunk - remove" on the phone is pushed straight back by
   the next laptop to sync, because the laptop still has the entry and cannot
   tell a deletion from data it has never seen. A device that has not synced in
   longer than this can still resurrect one. */
const TOMBSTONE_TTL = 90 * 24 * 60 * 60 * 1000;

/* Duty is charged per litre of pure alcohol, not per bottle. This matters:
   the easement that treated everything from 11.5% to 14.5% as if it were
   12.5% ended on 1 February 2025, and the L2.67-a-bottle figure that is still
   widely quoted predates it. At L29.54 per litre of pure alcohol a 12.5%
   bottle pays L2.77 and a 14.5% Chateauneuf pays L3.21. The export gives an
   alcohol content per row, so each wine is charged its own duty.

   VERIFY THIS AGAINST HMRC before trusting a delivered price: it is uprated
   most years, and a wrong rate here misprices every bottle in the app. */
const DUTY_PER_LPA = 29.54;
const VAT = 0.20;
/* BBR charges this per product when you break a case rather than taking all
   of it. It belongs to a withdrawal, not to a bottle. */
const PART_CASE_FEE = 10;

/* Years left in the window before a wine counts as closing. Three at 130
   bottles a year is time to drink a twelve in tranches without rushing. */
const CLOSING_YEARS = 3;

/* A comp above this multiple of the Liv-ex mark is a bad print, not a market.
   Clinet 2016 shows a BBX low of L1,000 against a L360 last trade. */
const OUTLIER_MULTIPLE = 2;

/* The timeline's x-axis. Showing the true full span would run 2006 to 2067
   and squeeze every bar into nothing, so it is clamped and anything running
   past the right edge is drawn with an open end rather than a truncated one. */
const AXIS_BACK = 4;
const AXIS_FORWARD = 26;

const STATES = {
  young:   { name: 'Not ready', colour: 'var(--st-young)',   blurb: 'inside no drinking window yet' },
  opening: { name: 'Opening',   colour: 'var(--st-opening)', blurb: 'drinkable and still improving' },
  prime:   { name: 'At best',   colour: 'var(--st-prime)',   blurb: 'in the middle of its window' },
  closing: { name: 'Closing',   colour: 'var(--st-closing)', blurb: 'three years or less of window left' },
  past:    { name: 'Past',      colour: 'var(--st-past)',    blurb: 'beyond the stated window' },
  unknown: { name: 'No window', colour: 'var(--st-unknown)', blurb: 'no window stated and no vintage to estimate from' },
};
const STATE_ORDER = ['closing', 'past', 'prime', 'opening', 'young', 'unknown'];

const REGION_COLOUR = {
  'Bordeaux': 'var(--rg-bordeaux)',
  'Burgundy': 'var(--rg-burgundy)',
  'Rhône': 'var(--rg-rhone)',
  'Piedmont': 'var(--rg-piedmont)',
  'Champagne': 'var(--rg-champagne)',
};

/* Sub-region inferred from the description, because the export gives a Region
   and never a sub-region.

   Two rules, and both have already caused a bug:

   ORDER MATTERS. The first match wins, so anything that is a substring of
   another entry comes after it. Savigny-les-Beaune, Chorey-les-Beaune and
   Cote de Beaune all contain "beaune"; Amarone della Valpolicella contains
   "valpolicella"; Cote de Brouilly contains "brouilly"; Chianti Classico
   contains "chianti". Each container is listed before the thing it contains.

   KEYWORDS MUST BE PRECISE. These keys also strip the geographic tail off a
   description when inferring the producer, so a loose key mislabels the wine
   and then misnames its grower. Three were caught writing this table: "port"
   sits inside "Portugal", so every Douro wine would have read as Port;
   "baden" sits inside "Badenhorst", the Swartland grower; "collio" sits
   inside "Collioure", which is in Roussillon. Port and Toro are matched with
   their commas because their names are too short to be safe bare. Baden and
   Collio are left out rather than made to work.

   A region name that is also the only appellation anyone writes - Champagne,
   Rioja, Alsace - appears here as its own sub-region. The funnel needs a
   level below the region, and repeating the name is better than inventing
   one. */
const SUBREGIONS = [
  /* Bordeaux */

  ['St Julien', ['st julien', 'saint-julien', 'st-julien']],

  /* Burgundy. A description often gives only the vineyard, so a grand cru is

/* =========================================================================
   Pure logic. No side effects, no React.
========================================================================= */

/* Combining accents and the byte-order mark, as char codes rather than
   literals: an invisible character in the source is easy for an editor or a
   copy-paste to mangle into something that matches nothing, and one of these
   was silently broken exactly that way during the first build. */
const COMBINING = new RegExp('[' + String.fromCharCode(768) + '-' +
                             String.fromCharCode(879) + ']', 'g');
const BOM = String.fromCharCode(65279);
const stripBom = s => (s && s.charAt(0) === BOM) ? s.slice(1) : s;

const fold = s => (s || '').toLowerCase()
  .normalize('NFD').replace(COMBINING, '')
  .replace(/\s+/g, ' ').trim();

/* The per-cent sign matters: the export writes alcohol content as "14.5%",
   and without stripping it every lot fell back to an assumed strength and was
   charged the wrong duty. */
function num(v) {
  if (v === null || v === undefined) return null;
  const s = String(v).replace(/[£,%\s]/g, '');
  if (!s) return null;
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

/* Whole pounds everywhere. Wine is not bought in pence and a column of
   figures reads faster without them. */
const money = n => (n === null || n === undefined || !Number.isFinite(n)) ? '—'
  : '£' + Math.round(n).toLocaleString('en-GB');
/* Rounding each line of a breakdown on its own lets the parts miss the total
   by a pound: 46.67 + 2.77 + 9.89 is 59.33, but rounded separately they come
   to 47 + 3 + 10 = 60 against a total of 59. A sum that does not add up looks
   broken, especially on a price. So round every line, then push the residue
   onto the largest, where a pound is proportionally least visible. */
function reconcileToTotal(rows, total) {
  const rounded = rows.map(([label, v]) => [label, Math.round(v)]);
  const drift = Math.round(total) - rounded.reduce((a, r) => a + r[1], 0);
  if (!drift) return rounded;
  let big = 0;
  for (let i = 1; i < rounded.length; i++) if (rounded[i][1] > rounded[big][1]) big = i;
  rounded[big] = [rounded[big][0], rounded[big][1] + drift];
  return rounded;
}
const money0 = n => (n === null || !Number.isFinite(n)) ? '—' : '£' + Math.round(n).toLocaleString('en-GB');
const pct = n => (n === null || !Number.isFinite(n)) ? '—' : (n > 0 ? '+' : '') + Math.round(n * 100) + '%';

function parseCsv(csv) {
  const rows = [];
  let field = '', row = [], quoted = false;
  for (let i = 0; i < csv.length; i++) {
    const c = csv[i];
    if (quoted) {
      if (c === '"') {
        if (csv[i + 1] === '"') { field += '"'; i++; } else quoted = false;
      } else field += c;
    } else if (c === '"') quoted = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n') {
      row.push(field.replace(/\r$/, ''));
      if (row.some(x => x.trim())) rows.push(row);
      row = []; field = '';
    } else field += c;
  }
  if (field || row.length) {
    row.push(field);
    if (row.some(x => x.trim())) rows.push(row);
  }
  if (rows.length && rows[0].length) rows[0][0] = stripBom(rows[0][0]);
  return rows;
}

function subRegionOf(description) {
  const d = fold(description);
  for (const [name, keys] of SUBREGIONS) {
    for (const k of keys) if (d.includes(fold(k))) return name;
  }
  return null;
}

/* The description is comma-separated and its shape depends on the region.
   Bordeaux leads with the chateau - "Chateau Langoa Barton, St Julien,
   Bordeaux" - while Burgundy leads with the appellation and puts the domaine
   second from last. So: prefer a segment that names itself a producer, fall
   back to a leading chateau, fall back again to second-from-last. This gets
   the whole of the August 2026 cellar right, which is a low bar; a note can
   pin a producer by hand and the pin wins. */
/* Segments that are places rather than producers, for stripping the tail of
   a description. Folded, so accents do not matter. */
const COUNTRIES = new Set(['france', 'italy', 'spain', 'portugal', 'germany', 'austria',
  'usa', 'california', 'australia', 'new zealand', 'south africa', 'chile', 'argentina',
  'hungary', 'greece', 'lebanon', 'england', 'united kingdom', 'israel', 'uruguay',
  'canada', 'switzerland', 'slovenia', 'croatia', 'romania', 'georgia']);
/* Matched exactly, never as a substring, which is what lets short and
   otherwise dangerous names sit here: "port" and "toro" are safe in this set
   and would be a menace in SUBREGIONS. */
const REGION_NAMES = new Set(['bordeaux', 'burgundy', 'bourgogne', 'rhone', 'piedmont',
  'piemonte', 'champagne', 'tuscany', 'toscana', 'languedoc', 'languedoc-roussillon',
  'loire', 'alsace', 'provence', 'beaujolais', 'jura', 'savoie', 'south west france',
  'veneto', 'lombardy', 'umbria', 'campania', 'sicily', 'sicilia', 'abruzzo',
  'friuli', 'marche', 'rioja', 'ribera del duero', 'priorat', 'navarra', 'toro',
  'douro', 'port', 'madeira', 'alentejo', 'mosel', 'nahe', 'rheingau',
  'rheinhessen', 'pfalz', 'wachau', 'kamptal', 'burgenland', 'tokaj',
  'napa valley', 'sonoma county', 'oregon', 'washington', 'south australia',
  'barossa valley', 'victoria', 'western australia', 'new south wales',
  'marlborough', 'central otago', 'hawkes bay', 'stellenbosch', 'swartland',
  'western cape', 'mendoza', 'uco valley', 'maipo valley', 'colchagua']);

/* Note the space after chateau: without it this matched "Chateauneu" and
   four Chateauneuf-du-Pape lots had the appellation as their producer. */
const PRODUCER_WORD = /^(ch(a|â)teau\s|dom(aine|\.)|maison|cascina|ciabot|clos |tenut[ae]|azienda|cantin[ae]|produttori|fattoria|podere|marchesi|weingut|schloss|bodegas?|quinta|herdade|casa |mas de|famille)/i;

function producerOf(description) {
  let parts = (description || '').split(',').map(s => s.trim()).filter(Boolean);
  if (!parts.length) return null;
  /* Strip the geographic tail first. BBR writes country, region and often the
     appellation at the end, and those segments were being mistaken for the
     producer - "Barolo, Commune di Serralunga d'Alba, Giovanni Rosso,
     Piedmont, Italy" returned "Piedmont", and "Alter Ego de Palmer, Margaux,
     Bordeaux" returned "Margaux". */
  /* A trailing segment is a place only if it reads as one. Two things stop a
     grower being mistaken for the ground they farm, and both were measured
     against the 6,123 wines in the BBX catalogue:

     A segment that names itself a producer is never a place. "Chateau de
     Puligny-Montrachet" is an estate, not the village, and "Produttori del
     Barbaresco" is a co-operative.

     A place name hyphenated onto the end of another word is a surname, not a
     place. Pierre-Yves Colin-Morey, Thomas Morey and Jobard-Morey are all
     growers, and all three were being stripped out as Morey-St Denis, which
     left the appellation standing as the producer. The keyword still counts
     when it opens the segment, so "Napa Valley" and "Los Carneros" are
     stripped as before. */
  const isPlace = seg => {
    const f = fold(seg);
    if (COUNTRIES.has(f) || REGION_NAMES.has(f)) return true;
    if (PRODUCER_WORD.test(seg)) return false;
    for (const [, keys] of SUBREGIONS) {
      for (const k of keys) {
        const kf = fold(k);
        for (let i = f.indexOf(kf); i !== -1; i = f.indexOf(kf, i + 1)) {
          if (i === 0 || f[i - 1] !== '-') return true;
        }
      }
    }
    return false;
  };
  while (parts.length > 1 && isPlace(parts[parts.length - 1])) parts.pop();
  /* A segment that names itself a producer wins. Taking the LAST such segment
     matters where a description carries two. */
  for (let i = parts.length - 1; i >= 0; i--) {
    if (PRODUCER_WORD.test(parts[i])) return parts[i];
  }
  /* Otherwise the last remaining segment: Burgundy and Piedmont put the
     grower after the vineyard, and once the places are gone that is what is
     left. Where only one segment survives it is a Bordeaux-style name that is
     both the wine and the producer. */
  return parts[parts.length - 1];
}

/* A lot is a holding, not a wine. Parent ID identifies a wine and a vintage,
   so on its own it matched a case of d'Issan bottles to a case of magnums and
   a Volnay to a jeroboam. Volume and price paid complete it - and two lots of
   Batailley 2022 differ only in what was paid for them. */
function lotKey(r) {
  return [r.parentId || '', r.volumeCl || '', r.pricePerCase === null ? '' : r.pricePerCase].join('|');
}

function headerIndex(headerRow) {
  const idx = {};
  headerRow.forEach((cell, i) => { idx[stripBom(cell).trim()] = i; });
  return idx;
}

function parseCellarCsv(text) {
  const rows = parseCsv(text);
  if (rows.length < 2) return { lots: [], problems: ['That file has no rows in it.'] };
  const idx = headerIndex(rows[0]);
  if (idx['Description'] === undefined || idx['Quantity in Bottles'] === undefined) {
    return { lots: [], problems: ['That does not look like a BBR cellar export - it has no Description or Quantity in Bottles column.'] };
  }
  const g = (row, name) => (idx[name] === undefined ? '' : String(row[idx[name]] === undefined ? '' : row[idx[name]]).trim());
  const lots = [];
  const problems = [];
  for (let i = 1; i < rows.length; i++) {
    const row = rows[i];
    const description = g(row, 'Description');
    if (!description) continue;
    const abvRaw = num(g(row, 'Alcohol Content'));
    const lot = {
      parentId: g(row, 'Parent ID'),
      country: g(row, 'Country'),
      region: g(row, 'Region').trim(),
      vintage: g(row, 'Vintage'),
      description,
      colour: g(row, 'Colour'),
      maturity: g(row, 'Maturity'),
      windowFrom: num(g(row, 'Drinking Window (From)')) || null,
      windowTo: num(g(row, 'Drinking Window (To)')) || null,
      format: g(row, 'Bottle Format'),
      volumeCl: num(g(row, 'Bottle Volume')) || 75,
      bottles: num(g(row, 'Quantity in Bottles')) || 0,
      pricePerCase: num(g(row, 'Purchase Price per Case')),
      caseSize: num(g(row, 'Case Size')),
      livex: num(g(row, 'Livex Market Price')),
      wsLowest: num(g(row, 'Wine Searcher Lowest List Price')),
      bbxLastTxn: num(g(row, 'BBX Last Transaction Price')),
      bbxLowest: num(g(row, 'BBX Lowest Price')),
      status: g(row, 'Current Status'),
      /* Stored as a fraction: "14.5%" becomes 0.145. */
      abv: abvRaw === null ? null : (abvRaw > 1 ? abvRaw / 100 : abvRaw),
    };
    lot.key = lotKey(lot);
    lot.subRegion = subRegionOf(description);
    lot.producer = producerOf(description);
    if (!lot.caseSize) problems.push(lot.vintage + ' ' + shortName(lot) + ' has no case size, so its per-bottle figures are unknown');
    lots.push(lot);
  }
  /* Two identical lot keys means two holdings the export cannot tell apart.
     Suffix them rather than silently dropping one. */
  const seen = new Map();
  for (const lot of lots) {
    const n = (seen.get(lot.key) || 0) + 1;
    seen.set(lot.key, n);
    if (n > 1) lot.key = lot.key + '#' + n;
  }
  return { lots, problems };
}

function shortName(lot) {
  const parts = (lot.description || '').split(',').map(s => s.trim()).filter(Boolean);
  if (parts.length > 2) parts.pop();
  return parts.join(', ').replace(/^Château\s+/i, 'Ch. ').replace(/^Chateau\s+/i, 'Ch. ');
}

/* ------------------------------------------------------ money per bottle */

function perBottle(lot) {
  if (!lot.pricePerCase || !lot.caseSize) return null;
  return lot.pricePerCase / lot.caseSize;
}

/* Liv-ex first, because on this cellar last-traded over Liv-ex measured 0.994
   - the mark is a clearing price, not a shop window. Bad prints rejected. */
function marketPerBottle(lot) {
  const cs = lot.caseSize;
  if (!cs) return null;
  const lx = lot.livex ? lot.livex / cs : null;
  const sane = v => {
    if (!v) return null;
    const p = v / cs;
    if (lx && p > lx * OUTLIER_MULTIPLE) return null;
    return p;
  };
  return lx || sane(lot.bbxLastTxn) || sane(lot.wsLowest) || sane(lot.bbxLowest) || null;
}

/* What a bottle is worth, with the price paid standing in where the export
   gives no mark at all. En primeur lines have no market yet, and a wine the
   export has no comp for would otherwise drop silently out of the "At market"
   total and make the cellar look smaller than it is. Paid is the least-wrong
   estimate available: it is what someone actually transacted at.

   marketPerBottle stays honest and returns null when it does not know, so the
   detail sheet can say so. Only the aggregate substitutes. */
function marketOrPaid(lot) {
  const mk = marketPerBottle(lot);
  return mk === null ? perBottle(lot) : mk;
}

function marketIsEstimated(lot) {
  return marketPerBottle(lot) === null && perBottle(lot) !== null;
}

/* Duty on one bottle of this wine, at its own strength and volume. Falls back
   to 13.5% - the middle of what this cellar holds - when the export gives no
   alcohol content, and the detail sheet says so rather than hiding it. */
function dutyPerBottle(lot) {
  const abv = lot.abv || 0.135;
  return (lot.volumeCl / 100) * abv * DUTY_PER_LPA;
}

/* The only price that matters for a drinking cellar: what one bottle costs
   once it has left bond and arrived at the house. Duty and VAT crystallise on
   the way out, and the part-case fee is charged per product, so it is spread
   over however many bottles you are actually pulling.

   There was a delivery charge here too, set by hand in Settings because BBR's
   varies with the order. It went on 24 August: there is no delivery charge to
   pay, so a field asking for one was a question with no answer, and a line on
   the breakdown that always read zero. */
function deliveredPerBottle(lot, bottlesPulled) {
  const ib = perBottle(lot);
  if (ib === null) return null;
  const duty = dutyPerBottle(lot);
  const taxed = (ib + duty) * (1 + VAT);
  const pulling = bottlesPulled || lot.bottles || 1;
  const partCase = !!(lot.caseSize && pulling % lot.caseSize !== 0);
  const fee = partCase ? PART_CASE_FEE / pulling : 0;
  return {
    ib, duty, vat: (ib + duty) * VAT, fee, partCase,
    total: taxed + fee,
  };
}

/* Bottles present last time and missing now, per lot. Increases are ignored:
   a lot that grew was topped up, and a lot that shrank and later grew again
   was drunk and then bought again - both of those are true at once, which is
   why history counts bottles rather than marking a wine gone. Nothing here
   ever deletes a history entry; a mistaken one is removed by hand. */
function withdrawals(previousRows, nextRows) {
  const now = new Map(nextRows.map(l => [l.key, l]));
  const out = [];
  for (const was of previousRows) {
    const still = now.get(was.key);
    const bottles = was.bottles - ((still && still.bottles) || 0);
    if (bottles > 0) out.push({ lot: was, bottles, full: !still });
  }
  return out;
}

/* The date a bottle left, written the way a person would say it. The app only
   knows which import noticed the bottles were gone, not the evening they were
   opened, so this is deliberately a date and never a time. */
function whenLeft(at) {
  if (!at) return 'at some point';
  const d = new Date(at);
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

/* =========================================================================
   Sync.

   One JSON file in a private repo you own, holding everything the app knows.
   The rules are per-kind, because the three kinds of data here are not alike
   and a single rule would be wrong for two of them:

   LOTS are a snapshot. Newest import wins, whole. Two devices holding
   different exports is not a merge to be resolved row by row - it is a
   question of which export is more recent, and merging them would invent a
   cellar that never existed.

   HISTORY is an append-only log. Union by event id, with tombstones for the
   handful removed by hand. Nothing edits an event, so there is no newest-wins
   question to answer.

   NOTES are per lot key and hand-edited on any device. Newest edit wins, which
   needs every note to carry when it was written. Nothing writes notes yet, so
   that field is being fixed now rather than invented on the day there is data
   to migrate - the same reason the key exists at all.

   What is NOT synced: the token and repo, which belong to one device, and the
   pre-upgrade snapshot, which is a local escape hatch and would be worse than
   useless coming back from somewhere else.
========================================================================= */

/* A history event needs a stable identity to be merged. A lot yields at most
   one event per import, so its key and the import stamp together are unique.
   Backfilled on read for entries written before sync existed. */
function eventId(e) {
  return e.id || (e.key + '@' + e.at);
}

function withIds(history) {
  return (history || []).map(e => (e && e.id) ? e : { ...e, id: eventId(e) });
}

function readPayload(p) {
  if (!p || typeof p !== 'object') return { lots: null, notes: {}, history: [], deleted: {} };
  return {
    lots: (p.lots && p.lots.rows) ? p.lots : null,
    notes: (p.notes && typeof p.notes === 'object') ? p.notes : {},
    history: withIds(Array.isArray(p.history) ? p.history : []),
    deleted: (p.deleted && typeof p.deleted === 'object') ? p.deleted : {},
  };
}

/* Keys sorted so two runs over the same data serialise identically. That is
   what lets a sync skip the write when nothing actually changed, which keeps
   the repo history readable and avoids a commit every time the app opens. */
function sortedKeys(map) {
  const out = {};
  for (const k of Object.keys(map || {}).sort()) out[k] = map[k];
  return out;
}

function writePayload(lots, notes, history, deleted) {
  return JSON.stringify({
    v: 1,
    lots: lots || null,
    notes: sortedKeys(notes),
    history: [...history].sort((a, b) => (a.at - b.at) || (eventId(a) < eventId(b) ? -1 : 1)),
    deleted: sortedKeys(deleted),
  });
}

/* The newer import wins outright. A missing importedAt is treated as older
   than anything stamped, so a snapshot from before this field existed loses to
   a real one rather than winning by accident. */
function mergeLots(local, remote) {
  if (!local) return remote || null;
  if (!remote) return local;
  return (remote.importedAt || 0) > (local.importedAt || 0) ? remote : local;
}

/* Union by id, minus anything a live tombstone covers. */
function mergeHistory(local, remote, deleted) {
  const byId = new Map();
  for (const e of withIds(remote)) byId.set(eventId(e), e);
  for (const e of withIds(local)) byId.set(eventId(e), e);
  return [...byId.values()]
    .filter(e => !deleted[eventId(e)])
    .sort((a, b) => (a.at - b.at) || (eventId(a) < eventId(b) ? -1 : 1));
}

/* Newest edit wins per lot key. A note with no updatedAt is treated as older
   than one that has it, so hand-written entries from before this field are
   never allowed to overwrite something newer. */
function mergeNotes(local, remote) {
  const out = { ...(remote || {}) };
  for (const k of Object.keys(local || {})) {
    const mine = local[k], theirs = out[k];
    if (!theirs || (mine.updatedAt || 0) >= (theirs.updatedAt || 0)) out[k] = mine;
  }
  return out;
}

/* Tombstones expire, or the file grows forever. */
function mergeDeleted(a, b) {
  const cutoff = Date.now() - TOMBSTONE_TTL;
  const out = {};
  for (const src of [a || {}, b || {}]) {
    for (const id of Object.keys(src)) {
      const ts = src[id];
      if (typeof ts === 'number' && ts > cutoff) out[id] = Math.max(out[id] || 0, ts);
    }
  }
  return out;
}

/* ------------------------------------------------------ drinking windows */

/* A note can pin a window, and the pin always wins: it is a deliberate value
   and recomputation must not touch it. */
/* Precedence, strongest first:
     1. a window you pinned yourself - a deliberate value, never recomputed
     2. the window in the BBR export
     3. a researched window from windows.json, for the lots the export leaves
        blank - real published guidance rather than a rule of thumb
     4. an estimate from vintage and sub-region, flagged as such everywhere

   The app says which of the four it is using at the point of use, because a
   researched window and a guessed one deserve different amounts of trust. */
function windowOf(lot, note, researched) {
  if (note && note.windowFrom && note.windowTo) {
    return { from: note.windowFrom, to: note.windowTo, source: 'yours' };
  }
  if (lot.windowFrom && lot.windowTo) {
    return { from: lot.windowFrom, to: lot.windowTo, source: 'bbr' };
  }
  const found = findWindow(lot, researched);
  if (found) {
    return { from: found.from, to: found.to, source: 'researched', basis: found.basis };
  }
  const v = num(lot.vintage);
  if (!v) return { from: null, to: null, source: 'none' };
  const span = ESTIMATED_SPANS[lot.subRegion] || ESTIMATED_SPANS[lot.region] || ESTIMATED_SPANS.default;
  return { from: v + span[0], to: v + span[1], source: 'estimated' };
}

/* windows.json entries carry an ALL-of match array and a vintage, the same
   scheme wines.json uses. Most specific wins, so a note for one vintage of a
   wine cannot be picked up by another. */
function findWindow(lot, researched) {
  const list = (researched && researched.windows) || [];
  const d = fold(lot.description);
  let best = null, bestScore = 0;
  for (const w of list) {
    if (String(w.vintage) !== String(lot.vintage)) continue;
    let score = 0, ok = true;
    for (const p of (w.match || [])) {
      const f = fold(p);
      if (!d.includes(f)) { ok = false; break; }
      score += f.length;
    }
    if (ok && score > bestScore) { best = w; bestScore = score; }
  }
  return best;
}

/* Kept as booleans because the screens ask these two questions constantly. */
const windowIsEstimated = w => w.source === 'estimated';
const windowLabel = w => (
  w.source === 'yours' ? 'yours' :
  w.source === 'bbr' ? 'per BBR' :
  w.source === 'researched' ? 'researched' :
  w.source === 'estimated' ? 'estimated' : ''
);

function stateOf(lot, note, year, researched) {
  const w = windowOf(lot, note, researched);
  if (!w.from || !w.to) return 'unknown';
  if (year < w.from) return 'young';
  if (year > w.to) return 'past';
  if (w.to - year <= CLOSING_YEARS) return 'closing';
  /* "At best" is the middle of the window. Before that it is opening -
     drinkable and improving, which is a different decision. */
  return (year - w.from) / Math.max(1, w.to - w.from) >= 0.25 ? 'prime' : 'opening';
}

/* ---------------------------------------------------- reference matching */

/* wines.json entries carry an array of substrings that must ALL appear in the
   folded description. The entry matching the most characters wins, which is
   what separates Batailley from Haut-Batailley and Haut-Bailly from
   Haut-Bailly II without any ordering rules. */
function matchWine(lot, wines) {
  const d = fold(lot.description);
  let best = null, bestScore = 0;
  for (const w of (wines || [])) {
    const parts = w.match || [];
    if (!parts.length) continue;
    let score = 0, ok = true;
    for (const p of parts) {
      const f = fold(p);
      if (!d.includes(f)) { ok = false; break; }
      score += f.length;
    }
    if (ok && score > bestScore) { best = w; bestScore = score; }
  }
  return best;
}

function matchVintage(lot, vintages) {
  if (!vintages) return null;
  const byRegion = vintages[lot.region] || vintages[(lot.region || '').trim()];
  if (!byRegion) return null;
  return byRegion[lot.vintage] || null;
}

const regionColour = region => REGION_COLOUR[(region || '').trim()] || 'var(--rg-other)';

  if (!a.length) return '';
  if (a.length === 1) return a[0];
  return a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
}

/* =========================================================================
   Region maps.

   Drilling into a region draws a map of it behind the page: rivers, the sea
   or estuary where there is one, wooded ground, appellation boundaries, the
   towns, and the names of the sub-areas. The geometry lives in maps.json
   rather than here, because it is reference data like wines.json - large,
   researched, and edited on a completely different rhythm from the code.

   These are STYLISED. The coordinates are drawn on a 0-100 grid from what
   published region maps show, not projected from survey data. What they get
   right is topology: which bank an appellation sits on, the order of the
   communes down a slope, which side of the town the good hill is. Do not
   measure anything off them.

   Appellations the cellar actually holds are drawn stronger and get a dot, so
   the map doubles as a picture of where your bottles sit in the region.

   Drawing order is a cartographer's, and it matters: wooded ground, then
   appellation fills, then their edges, then hills, then water, then towns,
   then type. Any other order and the labels end up under the polygons.
========================================================================= */

/* Opacities. The map has to survive being read through, so every one of these
   was pushed up until the map was legible and then backed off until a price
   sitting on top of it still was. Type carries furthest at low alpha, so it
   gets the smallest numbers. */
const NUMBERS_IN_PATH = new RegExp('-?[0-9]+(?:[.][0-9]+)?', 'g');

const MAP_ALPHA = {
  water: 0.15,
  forest: 0.05,
  appellation: 0.07,
  appellationOwned: 0.15,
  edge: 0.12,
  hill: 0.08,
  town: 0.18,
  areaLabel: 0.11,
  placeLabel: 0.12,
  placeLabelOwned: 0.24,
};

function heldPlaces(lots) {
  const held = new Set();
  for (const l of lots) if (l.subRegion) held.add(fold(l.subRegion));
  return held;
}

/* maps.json names regions in plain ASCII; the cellar calls the Rhone "Rhône".
   Fold both sides rather than keeping two spellings in step by hand. */
function mapFor(maps, region) {
  if (!maps) return null;
  const want = fold(region);
  for (const k of Object.keys(maps)) if (fold(k) === want) return maps[k];
  return null;
}

/* Where to hang an appellation name. The data may carry an explicit anchor;
   otherwise take the mean of the polygon points, which for the long thin
   strips these mostly are lands close enough to the middle. */
function appellationAnchor(ap) {
  if (ap.lx !== undefined && ap.ly !== undefined) return { x: ap.lx, y: ap.ly };
  const nums = (ap.path || '').match(NUMBERS_IN_PATH);
  if (!nums || nums.length < 4) return null;
  let sx = 0, sy = 0, n = 0;
  for (let i = 0; i + 1 < nums.length; i += 2) { sx += +nums[i]; sy += +nums[i + 1]; n++; }
  return n ? { x: sx / n, y: sy / n } : null;
}

/* Decluttering.

   Burgundy has 31 appellations, five towns and four district names. Drawn all
   at once at watermark scale that is not a map, it is a thicket - the labels
   sit on top of each other and none of them can be read. Real maps drop type
   rather than shrink it, so this does the same: walk the labels in priority
   order and skip any whose box overlaps one already placed.

   Priority is what the reader needs first. District names orient you, so they
   go down before anything else. Then the appellations you actually own, which
   are the reason the map is here at all. Then towns, then the appellations you
   do not own - those are context, and context is what should give way.

   The polygon underneath a dropped label is still drawn, so the shape of the
   region survives even where the name does not fit. */
const LABEL_CHAR_W = 0.52;   /* width of a character as a fraction of its size */
const LABEL_PAD = 0.8;       /* breathing room, in grid units */

function declutter(candidates) {
  const placed = [];
  const kept = [];
  /* A name can arrive twice - Blaye is both an appellation and the town it is
     named after, and Bordeaux is a region, a city and a wine. Printing it
     twice looks like a bug even when it is technically two features. First
     one in priority order wins. */
  const seen = new Set();
  for (const c of candidates) {
    const name = fold(c.text);
    if (seen.has(name)) continue;
    seen.add(name);
    const w = c.text.length * c.size * LABEL_CHAR_W;
    const half = c.anchor === 'middle' ? w / 2 : 0;
    const box = {
      x1: c.x - half - LABEL_PAD,
      x2: c.x - half + w + LABEL_PAD,
      y1: c.y - c.size - LABEL_PAD,
      y2: c.y + LABEL_PAD,
    };
    let clash = false;
    for (const p of placed) {
      if (box.x1 < p.x2 && box.x2 > p.x1 && box.y1 < p.y2 && box.y2 > p.y1) { clash = true; break; }
    }
    if (clash) continue;
    placed.push(box);
    kept.push(c);
  }
  return kept;
}

const RegionMap = ({ region, map, held }) => {
  if (!map) return null;
  const a = MAP_ALPHA;
  const water = map.water || [];
  const land = map.land || [];
  const apps = map.appellations || [];
  const towns = map.towns || [];
  const areas = map.areas || [];
  const forest = land.filter(x => x.kind === 'forest');
  const hills = land.filter(x => x.kind !== 'forest');

  const candidates = [];
  for (const ar of areas) {
    candidates.push({
      kind: 'area', text: ar.name, x: ar.x, y: ar.y, size: 2.6, anchor: 'middle',
      opacity: a.areaLabel, tracking: '0.22em', upper: true,
    });
  }
  for (const ap of apps) {
    if (!held.has(fold(ap.name))) continue;
    const p = appellationAnchor(ap);
    if (p) candidates.push({
      kind: 'app', text: ap.name, x: p.x + 0.4, y: p.y, size: 2.5,
      opacity: a.placeLabelOwned, weight: 600, serif: true,
    });
  }
  for (const t of towns) {
    candidates.push({
      kind: 'town', text: t.name, x: t.x + 2.2, y: t.y + 0.9,
      size: t.size === 'city' ? 2.9 : 2.4,
      opacity: a.town, weight: t.size === 'city' ? 600 : 500,
    });
  }
  for (const ap of apps) {
    if (held.has(fold(ap.name))) continue;
    const p = appellationAnchor(ap);
    if (p) candidates.push({
      kind: 'app', text: ap.name, x: p.x, y: p.y, size: 2.5,
      opacity: a.placeLabel, serif: true,
    });
  }
  const labels = declutter(candidates);

  return h('svg', {
    viewBox: '0 0 100 100', preserveAspectRatio: 'xMidYMid meet',
    'aria-hidden': 'true', focusable: 'false',
    style: {
      position: 'absolute', inset: 0, width: '100%', height: '100%',
      pointerEvents: 'none', zIndex: 0, color: regionColour(region),
    },
  }, [
    h('g', { key: 'forest', style: { opacity: a.forest } }, forest.map((f, i) =>
      h('path', { key: i, d: f.path, fill: 'currentColor', stroke: 'none' }))),

    /* No appellation polygons. They were drawn once and the map became a
       quilt: forty overlapping blocks of one hue, none of them legible and
       all of them fighting the numbers on top. The names alone, placed where
       the polygon's centroid was, carry the same information and leave the
       page readable. The geometry is still in maps.json - nothing has been
       thrown away, and the anchors are computed from it. */

    h('g', { key: 'hills', style: { opacity: a.hill } }, hills.map((x, i) =>
      h('path', {
        key: i, d: x.path, fill: 'none', stroke: 'currentColor',
        strokeWidth: 0.5, strokeLinecap: 'round',
      }))),

    h('g', { key: 'water', style: { opacity: a.water } }, water.map((w, i) =>
      h('path', {
        key: i, d: w.path,
        fill: w.kind === 'sea' ? 'currentColor' : 'none',
        stroke: 'currentColor', strokeWidth: w.width || 2,
        strokeLinecap: 'round', strokeLinejoin: 'round',
      }))),

    /* A ring for a city, a solid dot for a town - the distinction a printed
       map makes, and it costs one line. The dots are always drawn; only the
       names take part in decluttering. */
    h('g', { key: 'towndots', style: { opacity: a.town } }, towns.map(t =>
      h('circle', {
        key: t.name, cx: t.x, cy: t.y, r: t.size === 'city' ? 1.5 : 0.9,
        fill: t.size === 'city' ? 'none' : 'currentColor',
        stroke: 'currentColor', strokeWidth: t.size === 'city' ? 0.6 : 0,
      }))),

    h('g', { key: 'owneddots' }, apps.filter(ap => held.has(fold(ap.name))).map(ap => {
      const p = appellationAnchor(ap);
      return p ? h('circle', {
        key: ap.name, cx: p.x - 1.5, cy: p.y - 0.8, r: 0.75,
        fill: 'currentColor', opacity: a.placeLabelOwned,
      }) : null;
    })),

    h('g', { key: 'labels' }, labels.map(c => h('text', {
      key: c.kind + ':' + c.text,
      x: c.x, y: c.y, textAnchor: c.anchor || 'start',
      style: {
        fill: 'currentColor', fontSize: c.size, opacity: c.opacity,
        fontWeight: c.weight || 400,
        letterSpacing: c.tracking || '0.03em',
        textTransform: c.upper ? 'uppercase' : 'none',
        fontFamily: c.serif
          ? "'Newsreader',Georgia,serif"
          : "-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif",
      },
    }, c.text))),
  ]);
};

/* =========================================================================
   The mark.

   A wine glass in a ring, then the wordmark in italic Newsreader - the same
   face the app already loads for its prose, so the logo costs no extra font
   and sits in the same voice as everything else.

   Everything resolves through the colour variables rather than the hex values
   of the original artwork: the ring and the wine take --claret, the glass
   outline and the wordmark take --ink. The app is daylight-only, so nothing
   has to invert, but a mark that reads its colours from the page is still one
   less thing to remember if that ever changes.

   Drawn on a 48 grid. The bowl is one closed path and the wine is a second
   path clipped to the same silhouette below the waterline, rather than a
   rectangle behind a mask - fewer elements, and the meniscus stays put when
   the mark is scaled.
========================================================================= */

const Logo = ({ size }) => {
  const s = size || 40;
  return h('svg', {
    width: s, height: s, viewBox: '0 0 48 48',
    'aria-hidden': 'true', focusable: 'false',
    style: { display: 'block', flexShrink: 0 },
  }, [
    h('circle', {
      key: 'ring', cx: 24, cy: 24, r: 21.2,
      fill: 'none', stroke: CLARET, strokeWidth: 1.8,
    }),
    /* The wine sits under the outline so the rim draws over it. */
    h('path', {
      key: 'wine',
      d: 'M17.66 18.9 L18.26 22.9 C19.16 27.4 28.84 27.4 29.74 22.9 L30.34 18.9 Z',
      fill: CLARET, stroke: 'none',
    }),
    h('path', {
      key: 'bowl',
      d: 'M16.4 11.4 L18.26 22.9 C19.16 27.4 28.84 27.4 29.74 22.9 L31.6 11.4 Z',
      fill: 'none', stroke: INK, strokeWidth: 1.8,
      strokeLinejoin: 'round', strokeLinecap: 'round',
    }),
    h('path', {
      key: 'stem', d: 'M24 27.1 L24 34.5',
      stroke: INK, strokeWidth: 1.8, strokeLinecap: 'round',
    }),
    h('path', {
      key: 'foot', d: 'M18.8 35.3 L29.2 35.3',
      stroke: INK, strokeWidth: 1.8, strokeLinecap: 'round',
    }),
    /* A lowercase c and f flanking the glass, in the italic Newsreader the
       wordmark is set in, so the mark says the app's initials in the app's own
       hand. Both are placed against MEASURED glyph boxes rather than by eye,
       because the italic f is the awkward one: its top hook reaches right and
       its tail reaches left, making it 11 units wide against the c's 6, and
       the first version had it touching the ring on one side and lapping over
       the bowl on the other. As set here the f clears the ring by 0.57 units
       and the glass by 1.35. Change a size and those want re-measuring. */
    h('text', {
      key: 'c', x: 9.89, y: 26.5, textAnchor: 'middle',
      style: {
        fill: INK, fontFamily: "'Newsreader',Georgia,serif", fontStyle: 'italic',
        fontWeight: 500, fontSize: 13,
      },
    }, 'c'),
    h('text', {
      key: 'f', x: 38.01, y: 26.5, textAnchor: 'middle',
