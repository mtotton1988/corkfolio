        fill: INK, fontFamily: "'Newsreader',Georgia,serif", fontStyle: 'italic',
        fontWeight: 500, fontSize: 11,
      },
    }, 'f'),
  ]);
};

/* CellarTracker's mark, beside the link that goes there: two speech bubbles,
   "cellar" in a brick red one and "TRACKER" in a dark brown one.

   Drawn here rather than fetched, for the same two reasons as everything else
   in this folder - no third-party request, and it has to work with no
   connection - and it is deliberately an evocation rather than a facsimile. At
   the size this renders, what carries is two offset bubbles in their two
   colours; the letterforms are the app's own sans, not theirs.

   It is somebody else's trademark, used to say where the button goes, which is
   what a trademark is for. Worth a thought before this app is published
   anywhere public; the alternative is their name set as plain text, and the
   button says "CellarTracker" underneath either way. */
const CT_RED = '#a3282b';
const CT_DARK = '#3a2b25';

/* Laid out against measured text rather than by eye. At 11.5px bold the word
   "cellar" is 29 units wide and "TRACKER", letterspaced at 10px, is 48 - so
   the bubbles are 44 and 62 wide, which leaves about 8 units of air at the end
   of each. The first attempt had TRACKER finishing 0.2 units short of its own
   bubble's edge, which read as a mistake at any size. */
const CellarTrackerMark = ({ height }) => {
  const hgt = height || 30;
  return h('svg', {
    viewBox: '0 0 86 38', width: hgt / 38 * 86, height: hgt,
    style: { display: 'block', flexShrink: 0 },
    role: 'img', 'aria-label': 'CellarTracker',
  }, [
    /* Upper bubble, tail dropping from the left shoulder. */
    h('path', {
      key: 'b1', fill: CT_RED,
      d: 'M3 0 h38 a3 3 0 0 1 3 3 v14 a3 3 0 0 1 -3 3 h-23 l-6 6 v-6 h-9 a3 3 0 0 1 -3 -3 v-14 a3 3 0 0 1 3 -3 z',
    }),
    h('text', {
      key: 't1', x: 7, y: 14.5,
      style: {
        fill: '#fff', fontFamily: '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif',
        fontSize: 11.5, fontWeight: 700, letterSpacing: '-0.01em',
      },
    }, 'cellar'),
    /* Lower bubble, offset right and overlapping, tail on the right shoulder. */
    h('path', {
      key: 'b2', fill: CT_DARK,
      d: 'M27 18 h56 a3 3 0 0 1 3 3 v14 a3 3 0 0 1 -3 3 h-45 l-6 -6 h-5 a3 3 0 0 1 -3 -3 v-11 a3 3 0 0 1 3 -3 z',
    }),
    h('text', {
      key: 't2', x: 30, y: 32,
      style: {
        fill: '#fff', fontFamily: '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif',
        fontSize: 10, fontWeight: 700, letterSpacing: '0.04em',
      },
    }, 'TRACKER'),
  ]);
};

/* Wine-Searcher's mark: a charcoal plate, the bottle-and-lens glyph, and the
   name in white lowercase. Drawn rather than fetched, and an evocation rather
   than a facsimile, for the same reasons as the CellarTracker mark above -
   including the same caveat about it being somebody else's trademark.

   The glyph is the part that survives being shrunk: a bottle lying on its
   side whose neck ends in a lens. At 22px tall the name is small, so the
   plate carries the recognition and the words confirm it. */
const WS_PLATE = '#3a3a3a';
const WS_GREEN = '#5e7d20';
const WS_TYPE = '#b3b3b3';

/* Wine-Searcher's mark, stacked the way they set it: the bottle-and-lens glyph
   over the name, on a charcoal plate. A bottle lying on its side pointing
   right, a lens over its shoulder with the handle running up and to the left,
   white outlines, olive-green glass.

   Drawn rather than fetched, and an evocation rather than a facsimile - same
   reasons and the same trademark caveat as the CellarTracker mark above. The
   letterforms are this app's own sans, set light and loose, which is as close
   as a system font gets to theirs.

   The plate is a full pill, matching the maturity chip beside it, and that is
   what sets the width. A pill's corners eat into the box at exactly the height
   the word sits at: on an 86-unit-tall plate the curve is still 18 units in
   from the edge at the baseline, so the 146-unit word needs 192 units of plate
   rather than the 178 a square-cornered one needed. Everything is centred on
   that wider box.

   The viewBox is sized from the MEASURED text rather than guessed. The first
   attempt put a 15px word in a 132-unit box that the word needed 141 of, so
   the mark shipped reading "wine-search" with the last two letters cut off by
   its own edge - the same mistake as TRACKER above, made twice in one day. If
   the font size or the radius changes, re-measure the box. */
const WineSearcherMark = ({ height }) => {
  const hgt = height || 42;
  return h('svg', {
    viewBox: '0 0 192 86', width: hgt / 86 * 192, height: hgt,
    style: { display: 'block', flexShrink: 0 },
    role: 'img', 'aria-label': 'Wine-Searcher',
  }, [
    h('rect', { key: 'p', x: 0, y: 0, width: 192, height: 86, rx: 43, fill: WS_PLATE }),
    /* Shifted with the plate, so the glyph stays over the middle of the word. */
    h('g', { key: 'glyph', transform: 'translate(7,0)' }, [
      /* The bottle: body, shoulder, neck, cap - one path, outlined in white so
         it survives against the plate at any size. */
      h('path', {
        key: 'b', fill: WS_GREEN, stroke: '#fff', strokeWidth: 4,
        strokeLinejoin: 'round', strokeLinecap: 'round',
        d: 'M52 34 h50 l14 5 v0.5 h14 a3 3 0 0 1 3 3 v3 a3 3 0 0 1 -3 3 h-14 v0.5 l-14 5 h-50 '
         + 'a5 5 0 0 1 -5 -5 v-10 a5 5 0 0 1 5 -5 z',
      }),
      /* The lens, sitting over the bottle's shoulder, and its handle. */
      h('line', {
        key: 'h', x1: 70, y1: 22, x2: 58, y2: 10,
        stroke: '#fff', strokeWidth: 6, strokeLinecap: 'round',
      }),
      h('circle', { key: 'r', cx: 82, cy: 34, r: 15, fill: WS_GREEN, stroke: '#fff', strokeWidth: 4 }),
      /* The highlight inside the lens, which is what makes it read as glass. */
      h('path', {
        key: 'g', d: 'M74 36 a9 6 0 0 0 16 0', fill: 'none',
        stroke: '#fff', strokeWidth: 3, strokeLinecap: 'round',
      }),
    ]),
    h('text', {
      key: 't', x: 96, y: 74, textAnchor: 'middle',
      style: {
        fill: WS_TYPE, fontFamily: '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif',
        fontSize: 24, fontWeight: 300, letterSpacing: '0.005em',
      },
    }, 'wine-searcher'),
  ]);
};

/* The mark is the way home. Tapping it goes to the top of the funnel from
   anywhere - which is what every app with a logo in its header has taught
   people to expect, and this one had no equivalent: the breadcrumb only walks
   one level up, and nothing at all returned you from the Windows tab or from
   a search.

   It stays an h1, because it is still the page's heading, with a button
   inside it doing the work. A heading you can press is not a button; a button
   inside a heading is both. */
const Wordmark = ({ onHome }) => h('h1', {
  style: { margin: 0, flex: 1, minWidth: 0 },
}, h('button', {
  onClick: onHome,
  'aria-label': 'Corkfolio - back to the whole cellar',
  style: {
    display: 'flex', alignItems: 'center', gap: 9,
    border: 'none', background: 'transparent', padding: 0,
    margin: 0, textAlign: 'left', font: 'inherit', color: 'inherit',
  },
}, [
  h(Logo, { key: 'm', size: 40 }),
  h('span', {
    key: 'w',
    style: {
      fontFamily: "'Newsreader',Georgia,serif",
      fontStyle: 'italic', fontWeight: 500, fontSize: 25,
      letterSpacing: '0.005em', color: INK, lineHeight: 1,
    },
  }, 'Corkfolio'),
]));

const Stat = ({ k, v, tone }) => h('div', { style: sx.stat }, [
  h('div', { key: 'v', className: 'm-num', style: { ...sx.statV, color: tone || INK } }, v),
  h('div', { key: 'k', style: sx.statK }, k),
]);

const Eyebrow = ({ children }) => h('div', { style: sx.eyebrow }, children);

/* Horizontal bars rather than a treemap: on a phone a treemap of six regions
   is six rectangles you cannot label, and the labels are the useful part. */
const Bar = ({ label, value, of, right, colour, onClick }) => h(onClick ? 'button' : 'div', {
  style: {
    flexShrink: 0, display: 'flex', flexDirection: 'column', gap: 3,
    border: 'none', background: 'transparent', padding: 0, textAlign: 'left', width: '100%',
  },
  onClick,
}, [
  h('div', { key: 'l', style: { display: 'flex', fontSize: 12.5, gap: 8, alignItems: 'baseline' } }, [
    h('span', {
      key: 'a',
      style: { flex: 1, minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' },
    }, label),
    h('span', { key: 'b', className: 'm-num', style: { color: ink(0.55), fontSize: 11.5 } }, right),
  ]),
  h('div', {
    key: 'b', style: { height: 7, borderRadius: 4, background: ink(0.07), overflow: 'hidden' },
  }, h('div', {
    style: {
      width: (of ? Math.max(2, (value / of) * 100) : 0) + '%', height: '100%',
      background: colour || CLARET, borderRadius: 4,
    },
  })),
]);

/* =========================================================================
   The timeline.

   Every lot is one bar spanning its drinking window, with a line for today.
   No legend is needed to read it: a bar entirely right of the line is not
   ready, a bar the line has passed is gone, and a bar whose right end is
   close to the line is the one to open next.

   The axis is clamped to a window around today rather than showing the true
   full span, which on this cellar runs 2006 to 2067 and would squeeze every
   bar into a few pixels. A bar running past either edge is drawn with a
   squared-off open end rather than a rounded one, so a clipped window never
   reads as a window that ends there.
========================================================================= */

const TL_NAME_WIDTH = '46%';

const TimelineAxis = ({ from, to }) => {
  const span = to - from;
  const ticks = [];
  for (let y = Math.ceil(from / 5) * 5; y <= to; y += 5) ticks.push(y);
  /* Sticky, so the years stay readable all the way down a 56-row chart. A
     timeline whose axis scrolls away stops being a timeline about halfway
     through - you can see that a bar ends somewhere, but not when.

     It needs an opaque background of its own: transparent, the rows scroll
     up underneath the numbers and both become unreadable. The negative top
     margin and matching padding pull the strip up over the pane's own top
     padding, so nothing peeks out above it as it pins. */
  return h('div', {
    style: {
      flexShrink: 0, display: 'flex', gap: 8, alignItems: 'flex-end',
      height: 20, boxSizing: 'content-box',
      position: 'sticky', top: -15, zIndex: 2,
      marginTop: -4, paddingTop: 19, paddingBottom: 5,
      background: 'var(--surface)',
      borderBottom: '1px solid ' + ink(0.09),
    },
  }, [
    h('div', { key: 'a', style: { width: TL_NAME_WIDTH, flexShrink: 0 } }),
    h('div', { key: 'b', style: { flex: 1, position: 'relative', height: '100%' } }, [
      ...ticks.map(y => h('div', {
        key: y,
        style: {
          position: 'absolute', left: ((y - from) / span) * 100 + '%', bottom: 0,
          transform: 'translateX(-50%)', fontSize: 9.5, color: ink(0.42),
          fontVariantNumeric: 'tabular-nums', whiteSpace: 'nowrap',
        },
      }, String(y))),
    ]),
  ]);
};

const TimelineRow = ({ lot, win, state, from, to, now, onClick }) => {
  const span = to - from;
  const clampedFrom = Math.max(from, win.from);
  const clampedTo = Math.min(to, win.to);
  const left = ((clampedFrom - from) / span) * 100;
  const width = Math.max(1.5, ((clampedTo - clampedFrom) / span) * 100);
  const openLeft = win.from < from;
  const openRight = win.to > to;
  return h('button', {
    style: {
      flexShrink: 0, display: 'flex', gap: 8, alignItems: 'center', width: '100%',
      border: 'none', background: 'transparent', padding: '3px 0', textAlign: 'left',
    },
    onClick,
  }, [
    h('div', {
      key: 'n',
      style: {
        width: TL_NAME_WIDTH, flexShrink: 0, display: 'flex', gap: 6, alignItems: 'baseline',
        overflow: 'hidden',
      },
    }, [
      h('span', {
        key: 'd', className: 'm-state',
        style: {
          flexShrink: 0, width: 6, height: 6, borderRadius: 3,
          background: STATES[state].colour, display: 'inline-block',
        },
      }),
      h('span', {
        key: 'v', className: 'm-num',
        style: { flexShrink: 0, fontSize: 11.5, color: ink(0.5) },
      }, lot.vintage),
      h('span', {
        key: 't',
        style: {
          fontSize: 12.5, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
        },
      }, shortName(lot)),
    ]),
    h('div', {
      key: 'b',
      style: { flex: 1, position: 'relative', height: 14 },
    }, [
      /* the track */
      h('div', {
        key: 'tr',
        style: {
          position: 'absolute', inset: '5px 0', background: ink(0.055), borderRadius: 2,
        },
      }),
      /* today */
      h('div', {
        key: 'now',
        style: {
          position: 'absolute', left: ((now - from) / span) * 100 + '%', top: 0, bottom: 0,
          width: 1, background: 'rgba(var(--claret-rgb),0.55)',
        },
      }),
      /* the window */
      h('div', {
        key: 'w',
        style: {
          position: 'absolute', left: left + '%', width: width + '%', top: 3, bottom: 3,
          background: regionColour(lot.region),
          borderRadius: 3,
          borderTopLeftRadius: openLeft ? 0 : 3, borderBottomLeftRadius: openLeft ? 0 : 3,
          borderTopRightRadius: openRight ? 0 : 3, borderBottomRightRadius: openRight ? 0 : 3,
          opacity: state === 'young' ? 0.45 : state === 'past' ? 0.3 : 0.9,
        },
      }),
    ]),
  ]);
};

/* =========================================================================
   The donut.

   Bottles by region, and the way down a level. Drawn with stroke-dasharray on
   concentric circles rather than SVG arc paths: no path arithmetic, no
   large-arc-flag edge case when one slice is more than half the ring, and a
   slice that rounds to nothing still gets a visible sliver.

   The legend rows are the real controls - they are buttons, so they are
   reachable by keyboard and carry the numbers. The ring is tappable too,
   because on a phone that is what a thumb goes for.
========================================================================= */

const DONUT_R = 68;
const DONUT_SW = 30;
/* A hairline gap between slices, in user units of arc. Any larger and the
   smallest slice in the cellar disappears into its own gaps. */
const DONUT_GAP = 1.6;

/* The ring is BOTTLES, and the numbers above it are cases. That split is
   deliberate.

   BBR's case size is not one number: this cellar holds 48 lots in sixes, 5 in
   twelves and 3 in threes, so counting cases adds a twelve and a three
   together as though they were the same thing. It is the right unit for "how
   much have I got" - it is what BBR sells, stores and charges in, and what you
   would say to them on the phone - so it stays in the stat row. It is the
   wrong unit for a proportion. Measured on the August 2026 cellar the two
   splits agree within 2.2 points, Burgundy being the widest at 16.4% of cases
   against 18.6% of bottles, and Champagne the clearest case of the problem:
   three bottles taking the same slice a twelve would. Small today, and a
   function of what gets bought next rather than anything fixed, which is the
   reason to use the denominator that cannot drift.

   Bottles are not perfect either. One lot is in 150cl, and a magnum counts
   here as one bottle while holding two bottles' worth of wine. The only
   strictly uniform measure is volume, and "290 bottle-equivalents by region"
   is not a thing anyone says. One lot in 56 is a footnote, not a unit. */

/* The donut sits on its own plate. Drawn straight onto the region map the
   ring picked up rivers and appellation names through the gaps between the
   segments, and the legend percentages had type running underneath them -
   both of them the same hue as the map, which is the worst case. A surface
   with the page's own card colour cuts the map out from behind the one thing
   on the page you are meant to read precisely.

   The plate is translucent rather than solid, so the map still shows through
   faintly and the page does not look like it has a hole punched in it. At
   0.82 over a map already drawn at 0.15 the geography lands at roughly three
   per cent - present enough to read as continuous ground, nowhere near enough
   to compete with the percentages sitting on top of it. */
const Donut = ({ slices, total, centreTop, centreBottom, onPick }) => {
  const C = 2 * Math.PI * DONUT_R;
  let acc = 0;
  const arcs = slices.map(s => {
    const len = total > 0 ? s.bottles / total * C : 0;
    const arc = { s, len: Math.max(len - DONUT_GAP, 0.8), off: acc };
    acc += len;
    return arc;
  });
  return h('div', {
    style: {
      flexShrink: 0, display: 'flex', flexDirection: 'column', gap: 12,
      background: PLATE,
      border: '1px solid ' + ink(0.07),
      borderRadius: 12, padding: '14px 13px 6px',
    },
  }, [
    h('svg', {
      key: 'svg', viewBox: '0 0 200 200',
      style: { width: '100%', maxWidth: 224, display: 'block', margin: '0 auto' },
      role: 'img',
      'aria-label': slices.map(s => s.key + ' ' + s.bottles + ' bottles').join(', '),
    }, [
      ...arcs.map(a => h('circle', {
        key: a.s.key, cx: 100, cy: 100, r: DONUT_R, fill: 'none',
        stroke: a.s.colour, strokeWidth: DONUT_SW, strokeLinecap: 'butt',
        strokeDasharray: a.len + ' ' + (C - a.len),
        strokeDashoffset: -a.off,
        opacity: a.s.alpha === undefined ? 1 : a.s.alpha,
        transform: 'rotate(-90 100 100)',
        style: { cursor: onPick ? 'pointer' : 'default' },
        onClick: onPick ? () => onPick(a.s.key) : null,
      })),
      h('text', {
        key: 't1', x: 100, y: 96, textAnchor: 'middle',
        style: {
          fill: INK, fontFamily: "'Newsreader',Georgia,serif", fontSize: 30,
          fontVariantNumeric: 'tabular-nums',
        },
      }, centreTop),
      h('text', {
        key: 't2', x: 100, y: 114, textAnchor: 'middle',
        style: { fill: ink(0.5), fontSize: 11, letterSpacing: '0.08em', textTransform: 'uppercase' },
      }, centreBottom),
    ]),
    h('div', {
      key: 'leg',
      style: { display: 'flex', flexDirection: 'column', gap: 1 },
    }, slices.map(s => h('button', {
      key: s.key,
      style: {
        display: 'flex', alignItems: 'center', gap: 9, width: '100%',
        border: 'none', background: 'transparent', padding: '7px 2px',
        borderBottom: '1px solid ' + ink(0.07), textAlign: 'left', fontSize: 13,
      },
      onClick: onPick ? () => onPick(s.key) : null,
    }, [
      h('span', {
        key: 'sw',
        style: {
          flexShrink: 0, width: 11, height: 11, borderRadius: 3,
          background: s.colour, opacity: s.alpha === undefined ? 1 : s.alpha,
        },
      }),
      h('span', {
        key: 'n',
        style: { flex: 1, minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' },
      }, s.key),
      h('span', { key: 'c', className: 'm-num', style: { color: ink(0.55), fontSize: 12 } },
        s.bottles + ' btl'),
      /* 0.62 rather than the 0.4 this started at. Measured on the plate, 0.4
         gave 2.5:1 in daylight - fine for a graphical element, nowhere near
         the 4.5:1 a line of type wants, and this is type. 0.62 measures
         4.7:1 in daylight and 6.1:1 in the evening, and still reads as
         quieter than the case count beside it. */
      h('span', {
        key: 'p', className: 'm-num',
        style: { color: ink(0.62), fontSize: 12, width: 34, textAlign: 'right' },
      }, total > 0 ? Math.round(s.bottles / total * 100) + '%' : '—'),
      onPick ? h('span', { key: 'x', style: { color: ink(0.3), fontSize: 14 } }, '›') : null,
    ]))),
  ]);
};

/* =========================================================================
   App
========================================================================= */

class App extends React.Component {
  state = {
    lots: undefined,          /* undefined until loaded; null = never imported */
    notes: {},
    ref: null,                /* { wines, vintages } once the JSON has loaded */
    maps: null,               /* region geometry from maps.json */
    researched: null,         /* drinking windows from windows.json */
    regionNotes: null,        /* region prose from regions.json */
    saying: null,             /* how to pronounce a place, from regions.json */
    refError: null,
    tab: 'cellar',           /* cellar | windows */
    /* Where you are in the funnel. Null and null is the whole cellar. */
    dRegion: null, dSub: null,
    fState: null, fQuery: '',
    /* Which side of the bonded warehouse the list is showing. A second axis
       from fState, not a third value of it: readiness is about a wine, this is
       about where the bottles are, and a bottle can be both At best and at
       home. Defaults to bond because every total in the app is about bond. */
    fWhere: 'bond',
    sheet: null, sheetArg: null,
    toastMsg: null, busy: null,
    localFile: false,        /* a cellar.local.csv sits next to index.html */
    homeFile: false,         /* and a home.local.csv beside it */
    homeSource: null,        /* which home export was last read */
    history: [],             /* out of bond: at home or consumed, oldest first */
    syncCfg: null,           /* { token, repo } once sync is set up */
    syncStatus: 'off',       /* off | syncing | ok | error */
    syncHint: null,          /* what went wrong, in words */
    showSyncSetup: false,
    tokenInput: '', repoInput: '',
  };

  componentDidMount() {
    const stored = this.load('corkfolio.lots.v1');
    const notes = this.load('corkfolio.notes.v1') || {};
    const history = withIds(this.load(HISTORY_KEY) || []);
    const homeSource = this.load(HOME_SOURCE_KEY);
    const syncCfg = this.load(SYNC_KEY);

    /* Written once, never overwritten, so the first run of a new build always
       leaves a way back. */
    if (!localStorage.getItem(PRE_UPGRADE_KEY)) {
      this.save(PRE_UPGRADE_KEY, { at: Date.now(), lots: stored, notes });
    }

    this.setState({ notes, history, homeSource, lots: stored || null, syncCfg: syncCfg || null });
    this.loadReference();
    this.probeLocalFile();
    this.probeHomeFile();
    /* A sync on open, so a phone picked up after a laptop import is already
       right rather than right after you remember to ask. Delayed so it never
       competes with the first paint. */
    if (syncCfg) setTimeout(this.syncNow, 400);
  }

  componentWillUnmount() {
    clearTimeout(this._toastTimer);
  }

  /* The reference files ship with the app, so this is a same-origin fetch the
     service worker has already cached. If it fails the app still works - the
     detail sheet says the notes are unavailable rather than inventing any. */
  async loadReference() {
    try {
      const [w, v, m, dw, rg] = await Promise.all([
        fetch('./wines.json').then(r => r.json()),
        fetch('./vintages.json').then(r => r.json()),
        /* The maps are decoration. A failure here must not take the reference
           notes down with them. */
        fetch('./maps.json').then(r => r.json()).catch(() => ({ regions: {} })),
        fetch('./windows.json').then(r => r.json()).catch(() => ({ windows: [] })),
        fetch('./regions.json').then(r => r.json()).catch(() => ({ regions: {} })),
      ]);
      this.setState({
        ref: { wines: w.wines || [], vintages: v.vintages || {} },
        maps: (m && m.regions) || {},
        researched: dw || { windows: [] },
        regionNotes: (rg && rg.regions) || {},
        saying: (rg && rg.pronunciations) || {},
      });
    } catch (e) {
      this.setState({ refError: 'Reference notes could not be loaded.' });
    }
  }

  /* A cellar.local.csv beside index.html turns the empty state into a single
     tap. It exists because clearing storage during development meant hunting
     through a file picker every time, and because a demo of an empty app is
     not a demo of anything. It is in .gitignore: it is the one file that could
     put holdings in a public repo. */
  async probeLocalFile() {
    try {
      const res = await fetch('./cellar.local.csv', { method: 'GET' });
      if (!res.ok) return;
      const text = await res.text();
      if (!/Description/.test(text)) return;
      this._localText = text;
      this.setState({ localFile: true });
    } catch (e) { /* absent is the normal case */ }
  }

  async probeHomeFile() {
    try {
      const res = await fetch('./home.local.csv');
      if (!res.ok) return;
      const text = await res.text();
      if (!/Description/.test(text)) return;
      this._homeText = text;
      this.setState({ homeFile: true });
    } catch (e) { /* absent is the normal case */ }
  }

  loadHomeFile = async () => {
    if (!this._homeText) return;
    this.setState({ busy: 'Reading the home cellar...' });
    await new Promise(r => setTimeout(r, 20));
    this.ingestHome(this._homeText, 'home.local.csv');
  };

  importHome = async (file) => {
    if (!file) return;
    this.setState({ busy: 'Reading the home cellar...' });
    try {
      this.ingestHome(await this.readFile(file), file.name);
    } catch (e) {
      this.toast('That file ' + e.message + '.');
      this.setState({ busy: null });
    }
  };

  loadLocalFile = async () => {
    if (!this._localText) return;
    this.setState({ busy: 'Reading the export...' });
    await new Promise(r => setTimeout(r, 20));
    this.ingest(this._localText, 'cellar.local.csv');
  };

  load(key) { try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; } }
  save(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch (e) { this.toast('Could not save - device storage is full.'); return false; }
  }

  toast(msg) {
    this.setState({ toastMsg: msg });
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => this.setState({ toastMsg: null }), 3800);
  }

  readFile(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(String(r.result || ''));
      r.onerror = () => reject(new Error('could not be read'));
      r.readAsText(file);
    });
  }

  importCellar = async (file) => {
    if (!file) return;
    this.setState({ busy: 'Reading the export...' });
    try {
      this.ingest(await this.readFile(file), file.name);
    } catch (e) {
      this.toast('That file ' + e.message + '.');
      this.setState({ busy: null });
    }
  };

  /* One path for both ways in - the file picker and cellar.local.csv - so the
     diff reporting and the problem list cannot drift apart between them. */
  ingest(text, sourceName) {
    const { lots, problems } = parseCellarCsv(text);
    if (!lots.length) {
      this.toast(problems[0] || 'No wines found in that file.');
      this.setState({ busy: null });
      return;
    }
    const previous = this.state.lots;
    const previousRows = (previous && previous.rows) || [];
    const before = new Set(previousRows.map(l => l.key));
    const after = new Set(lots.map(l => l.key));
    const added = [...after].filter(k => !before.has(k)).length;
    const gone = [...before].filter(k => !after.has(k)).length;

    /* Bottles that were in the last export and are not in this one. The export
       is the whole truth about what sits in bond, so a bottle that has left it
       has come home - it has not stopped existing. */
    const at = Date.now();
    const left = withdrawals(previousRows, lots).map(w =>
      this.historyEvent(w.lot, w.bottles, w.full, at));
    const leftBottles = left.reduce((a, e) => a + e.bottles, 0);

    /* An export that is stale or truncated looks exactly like a cellar someone
       drank most of, and the difference matters far too much to guess at. Over
       a quarter of the bottles in one import, and it asks - with the number,
       because a confirmation that does not say what is at stake is worse than
       none. Cancelling changes nothing at all: the holdings on the device are
       the ones from the last import. */
    const wasBottles = previousRows.reduce((a, l) => a + l.bottles, 0);
    if (wasBottles && leftBottles > wasBottles * 0.25) {
      const ok = window.confirm(
        'This export is ' + leftBottles + ' bottles lighter than the last one, across ' +
        left.length + (left.length === 1 ? ' wine' : ' wines') + '.\n\n' +
        'Importing it will move those bottles to home and consumed. ' +
        'If this is an older export than the one already loaded, cancel - nothing will change.');
      if (!ok) {
        this.setState({ busy: null });
        this.toast('Import cancelled. Nothing changed.');
        return;
      }
    }

    const next = { rows: lots, importedAt: at, source: sourceName, problems };
    this.setState({
      lots: next, busy: null, sheet: null,
      /* A fresh import should land you at the top of the funnel, not deep
         inside a region that the new export may no longer contain. */
      dRegion: null, dSub: null, fState: null, fQuery: '',
    });
    this.save('corkfolio.lots.v1', next);

    if (left.length) {
      const history = this.state.history.concat(left);
      this.setState({ history });
      this.save(HISTORY_KEY, history);
    }

    this.queueSync();

    /* The diff is the valuable part: it says a case arrived or left without
       you reading a single row. */
    const bits = [lots.length + ' wines, ' + lots.reduce((a, l) => a + l.bottles, 0) + ' bottles'];
    if (previous) {
      if (added) bits.push(added + ' new');
      if (leftBottles) bits.push(leftBottles + ' came home');
      else if (gone) bits.push(gone + ' gone');
      if (!added && !gone && !leftBottles) bits.push('no change');
    }
    this.toast('Imported ' + bits.join(' · '));
  }


  /* --------------------------------------------------- the home cellar export

     A second export, "my-home-cellar-view", listing what is at home rather
     than in bond. It is the same schema as the bond export and has the same
     Current Status of "In bond" on every row - BBR does not distinguish, so
     the FILE is the signal and no column in it is.

     This is a better source than the inference it sits beside. Diffing two
     bond exports can only say a bottle went missing between two dates; the
     home export says plainly what is at home, including everything that left
     before the app existed. The eleven wines in the first one are exactly the
     lots that were unaccounted for on day one.

     Two rules make it safe to import as often as you like:

     REPLACED, NOT ACCUMULATED. Home-export entries carry origin 'home' and
     every import drops the previous set before adding the new one. The file is
     the whole truth about what is at home, the same way the bond export is the
     whole truth about what is in bond, so it is a snapshot and not a log. Two
     imports of the same file leave exactly one set of entries.

     NEVER TOUCHES `lots`. Nothing here can reach the totals, the donut, the
     timeline or the readiness states, because those all read `lots` and this
     writes to `history`. Structural rather than a rule to remember.

     The date is null and stays null. The file says a bottle is at home; it
     does not say when it left. whenLeft() already renders that as "at some
     point", which is the honest answer and better than a made-up date that
     would also change every time the file was re-imported.
  ------------------------------------------------------------------------- */

  ingestHome(text, sourceName) {
    const { lots, problems } = parseCellarCsv(text);
    if (!lots.length) {
      this.toast(problems[0] || 'No wines found in that file.');
      this.setState({ busy: null });
      return;
    }

    /* A tombstoned entry stays gone. Someone removed it by hand for a reason,
       and a re-import quietly resurrecting it would make the removal feel
       broken - the same reason deletes travel between devices at all. */
    const dead = this.loadDeleted();
    const inBond = new Set(this.lots().map(l => l.key));
    const fresh = [];
    let suppressed = 0;
    for (const lot of lots) {
      /* "The last of them" only if none of that lot is still in bond. Twelve
         bought and six pulled home share one lot key - the price is the same -
         so the same key can legitimately appear in both files, and calling
         those six the last of them would be wrong. */
      const e = this.historyEvent(lot, lot.bottles, !inBond.has(lot.key), null, 'home');
      if (dead[eventId(e)]) { suppressed++; continue; }
      fresh.push(e);
    }

    const kept = this.state.history.filter(e => e.origin !== 'home');
    const replaced = this.state.history.length - kept.length;

    /* A lot can honestly be in both files: twelve bottles bought, six pulled
       home, six still in bond, one price and therefore one lot key. That is
       not a conflict. What IS worth saying is when the same lot has also been
       inferred as withdrawn from a bond diff, because then the same bottles
       may be counted twice - once from the guess and once from the file. */
    const homeKeys = new Set(fresh.map(e => e.key));
    const alsoInferred = kept.filter(e => homeKeys.has(e.key)).length;

    const history = kept.concat(fresh);
    this.setState({ history, busy: null, sheet: null });
    this.save(HISTORY_KEY, history);
    this.save(HOME_SOURCE_KEY, { at: Date.now(), source: sourceName, wines: fresh.length });
    this.queueSync();

    const bottles = fresh.reduce((a, e) => a + e.bottles, 0);
    const bits = [fresh.length + (fresh.length === 1 ? ' wine' : ' wines') + ', ' + bottles + ' bottles at home'];
    if (replaced) bits.push('replacing ' + replaced);
    if (suppressed) bits.push(suppressed + ' left removed');
    this.toast('Home cellar: ' + bits.join(' · '));

    if (alsoInferred) {
      /* Said separately and after, because it is a thing to look at rather
         than a result. */
      setTimeout(() => this.toast(
        alsoInferred + (alsoInferred === 1 ? ' wine' : ' wines') +
        ' also has an entry from a bond diff. Check Home and consumed for a double count.'), 4200);
    }
  }

  download(name, text, mime) {
    const blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  /* ------------------------------------------------------------ selectors */

  /* Every screen asks for a window or a state constantly. These close over
     the notes and the researched table so no call site has to remember to
     pass them - forgetting one was how a lot could silently fall back to the
     rule of thumb on one screen and not another. */
  win(lot) { return windowOf(lot, this.state.notes[lot.key], this.state.researched); }
  lotState(lot) { return stateOf(lot, this.state.notes[lot.key], this.year(), this.state.researched); }

  lots() { return (this.state.lots && this.state.lots.rows) || []; }

  /* Everything worth keeping about a bottle that has gone, copied rather than
     referenced, because the lot it came from will not survive the next import.
     The prices freeze here on purpose: a bottle you have drunk cost what it
     cost, and a market value that kept moving afterwards would be a number
     about a wine you no longer own. */
  historyEvent(lot, bottles, full, at, origin) {
    const d = deliveredPerBottle(lot, bottles);
    const win = this.win(lot);
    return {
      at, bottles, full, key: lot.key,
      /* Absent means inferred from a bond diff, which is what every entry
         written before the home export existed was. Additive, so those stay
         valid without being touched. */
      ...(origin ? { origin } : {}),
      description: lot.description, vintage: lot.vintage,
      region: lot.region, subRegion: lot.subRegion, producer: lot.producer,
      volumeCl: lot.volumeCl, caseSize: lot.caseSize,
      paidPerBottle: perBottle(lot),
      marketPerBottle: marketPerBottle(lot),
      deliveredPerBottle: d ? d.total : null,
      windowFrom: win.from, windowTo: win.to,
    };
  }

  /* Home and consumed, narrowed to wherever you are in the funnel. The
     events carry the region and sub-region they had when they left, so
     drilling into Bordeaux and switching to Home/Consumed answers "what have
     I drunk of my Bordeaux" rather than starting again from the whole cellar. */
  scopedHistory() {
    const st = this.state;
    return this.state.history.filter(e => {
      if (st.dRegion && e.region !== st.dRegion) return false;
      if (st.dSub && (e.subRegion || 'Not recognised') !== st.dSub) return false;
      return true;
    });
  }

  historyTotals() {
    const h = this.state.history;
    const bottles = h.reduce((a, e) => a + e.bottles, 0);
    const paid = h.reduce((a, e) => a + (e.paidPerBottle || 0) * e.bottles, 0);
    const delivered = h.reduce((a, e) => a + (e.deliveredPerBottle || 0) * e.bottles, 0);
    return { bottles, paid, delivered, wines: new Set(h.map(e => e.key)).size };
  }

  /* The only way an entry leaves. BBR briefly dropping a row, or an export
     imported out of order, invents a bottle you have not drunk, and there has
     to be a way to say so. */
  forgetHistory(i) {
    const e = this.state.history[i];
    if (!e) return;
    if (!window.confirm('Remove ' + e.bottles + (e.bottles === 1 ? ' bottle' : ' bottles') +
      ' of ' + e.vintage + ' ' + shortName(e) + ' from home and consumed?\n\n' +
      'Use this when the bottles never actually left bond - an export imported out of ' +
      'order, or a row BBR dropped and put back. It cannot be undone.')) return;
    const history = this.state.history.slice(0, i).concat(this.state.history.slice(i + 1));
    /* A tombstone, not just a shorter list: without one the other device still
       holds the entry, cannot tell a removal from news, and pushes it back. */
    const deleted = { ...this.loadDeleted(), [eventId(e)]: Date.now() };
    this.setState({ history });
    this.save(HISTORY_KEY, history);
    this.save(DELETED_KEY, deleted);
    this.queueSync();
    this.toast('Removed from history.');
  }
  year() { return new Date().getFullYear(); }

  /* ================================================================ views */

  renderEmpty() {
    return h('div', { style: sx.empty }, [
      h('div', {
        key: 'a',
        style: { ...sx.prose, maxWidth: 330, margin: '0 auto 16px', color: ink(0.7) },
      }, 'Corkfolio reads the “My Cellar” export from Berry Bros. and shows you what you have, when each wine is ready, and what a bottle costs once duty and VAT are paid.'),
      h('div', {
        key: 'b',
        style: { display: 'flex', flexDirection: 'column', gap: 8, alignItems: 'center' },
      }, [
        h('label', { key: 'p', style: { ...btn('primary'), display: 'inline-block' } }, [
          'Import a BBR export',
          h('input', {
            key: 'i', type: 'file', accept: '.csv,text/csv', style: { display: 'none' },
            onChange: e => { const f = e.target.files[0]; e.target.value = ''; this.importCellar(f); },
          }),
        ]),
        this.state.localFile
          ? h('button', { key: 'l', style: btn('plain'), onClick: this.loadLocalFile },
              'Load the export in this folder')
          : null,
      ]),
      h('div', {
        key: 'c',
        style: { fontSize: 12, color: ink(0.45), marginTop: 14, maxWidth: 300, marginLeft: 'auto', marginRight: 'auto' },
      }, 'The file stays on this device. Nothing is uploaded.'),
    ]);
  }

  renderWindows(shown) {
    const y = this.year(), notes = this.state.notes;
    const from = y - AXIS_BACK, to = y + AXIS_FORWARD;
    const rows = shown
      .map(lot => ({ lot, win: this.win(lot), state: this.lotState(lot) }))
      .filter(r => r.win.from && r.win.to)
      /* Soonest to close, first. That ordering answers "what should I drink
         next" without anyone having to sort anything. */
      .sort((a, b) => a.win.to - b.win.to || a.win.from - b.win.from);
    /* A lot with no window and no vintage to estimate from cannot be drawn on
       a year axis, so it is dropped. Say so rather than quietly showing a
       shorter list: a missing bar is invisible, and a count is the only thing
       that tells you the timeline is not the whole cellar. It cannot happen
       with today's export - every lot carries a vintage, so the estimate
       always fires - which is exactly why it has to speak up if it ever
       does. */
    const dropped = shown.length - rows.length;
    const out = [];
    out.push(h(Eyebrow, { key: 'e' }, 'Drinking windows, soonest to close'));
    if (dropped > 0) {
      out.push(h('div', { key: 'drop', style: sx.note },
        dropped === 1
          ? 'One wine is not on the timeline: no drinking window, and no vintage to estimate one from.'
          : dropped + ' wines are not on the timeline: no drinking window, and no vintage to estimate one from.'));
    }
    out.push(h('div', {
      key: 'tl',
      style: { flexShrink: 0, display: 'flex', flexDirection: 'column' },
    }, [
      h(TimelineAxis, { key: 'ax', from, to }),
      ...rows.map(r => h(TimelineRow, {
        key: r.lot.key, lot: r.lot, win: r.win, state: r.state, from, to, now: y,
        onClick: () => this.setState({ sheet: 'lot', sheetArg: r.lot.key }),
      })),
    ]));

    const regions = [...new Set(shown.map(l => l.region))];
    out.push(h('div', {
      key: 'leg',
      style: { flexShrink: 0, display: 'flex', flexWrap: 'wrap', gap: '4px 12px', fontSize: 11, color: ink(0.55) },
    }, regions.map(r => h('span', {
      key: r, style: { display: 'flex', alignItems: 'center', gap: 5 },
    }, [
      h('span', {
        key: 'd',
        style: { width: 9, height: 9, borderRadius: 2, background: regionColour(r), display: 'inline-block' },
      }),
      r,
    ]))));

    return out;
  }

  lotRow(lot) {
    const notes = this.state.notes;
    const state = this.lotState(lot);
    const win = this.win(lot);
    const d = deliveredPerBottle(lot, lot.bottles);
    return h('button', {
      key: lot.key, style: sx.row,
      onClick: () => this.setState({ sheet: 'lot', sheetArg: lot.key }),
    }, [
      h('div', {
        key: 's', className: 'm-state',
        style: { flexShrink: 0, width: 3, borderRadius: 2, background: STATES[state].colour },
      }),
      h('div', { key: 'm', style: sx.rowMain }, [
        h('div', { key: 't', style: sx.rowTitle }, lot.vintage + ' ' + shortName(lot)),
        h('div', { key: 'd', style: sx.rowMeta }, [
          h('span', { key: 'a' }, lot.subRegion || lot.region),
          h('span', { key: 'b', className: 'm-num' }, lot.bottles + (lot.bottles === 1 ? ' bottle' : ' bottles')),
          h('span', { key: 'c', className: 'm-num' },
            win.from ? win.from + '–' + win.to + (windowIsEstimated(win) ? ' est' : '') : 'no window'),
        ]),
      ]),
      h('div', { key: 'r', style: sx.rowRight }, [
        h('div', { key: 'a', className: 'm-num', style: { fontSize: 14.5, fontWeight: 600 } },
          d ? money(d.total) : '—'),
        h('div', {
          key: 'b', className: 'm-state',
          style: { fontSize: 10, color: STATES[state].colour, fontWeight: 600 },
        }, STATES[state].name),
      ]),
    ]);
  }

  /* The same shape as a wine row, so a search reads as one list, with three
     things swapped: no maturity state, because a bottle that has gone does not
     have one; the date it left where the drinking window would be; and the
     price frozen at what it cost delivered rather than recomputed. Tapping it
     opens history rather than a lot sheet - the lot itself is gone, and the
     next import will not bring it back. */
  historyRow(e, i) {
    return h('button', {
      key: 'hist-' + e.key + '-' + e.at + '-' + i, style: sx.rowHistory,
      onClick: () => this.setState({ sheet: 'history' }),
    }, [
      h('div', {
        key: 's',
        style: { flexShrink: 0, width: 3, borderRadius: 2, background: 'var(--hist)' },
      }),
      h('div', { key: 'm', style: sx.rowMain }, [
        h('div', { key: 't', style: sx.rowTitle }, e.vintage + ' ' + shortName(e)),
        h('div', { key: 'd', style: sx.rowMeta }, [
          h('span', { key: 'a' }, e.subRegion || e.region),
          h('span', { key: 'b', className: 'm-num' },
            e.bottles + (e.bottles === 1 ? ' bottle' : ' bottles')),
          h('span', { key: 'c' },
          e.origin === 'home' ? 'from the home export' : 'left ' + whenLeft(e.at)),
        ]),
      ]),
      h('div', { key: 'r', style: sx.rowRight }, [
        h('div', { key: 'a', className: 'm-num', style: { fontSize: 14.5, fontWeight: 600 } },
          e.deliveredPerBottle ? money(e.deliveredPerBottle) : '—'),
        h('div', {
          key: 'b',
          style: { fontSize: 10, color: 'var(--hist)', fontWeight: 600, letterSpacing: '0.08em' },
        }, 'AT HOME'),
      ]),
    ]);
  }

  /* ------------------------------------------------------------ GitHub sync

     Ported from Memoire, whose sync has been in use for longer and whose
     shape - pull, merge, write back only if changed, retry once on a lost
     race - is the part worth copying. What differs is the merge, because the
     data differs: see the block above `readPayload`. */

  b64e(str) { return btoa(unescape(encodeURIComponent(str))); }
  b64d(str) { return decodeURIComponent(escape(atob(str))); }

  ghFetch(cfg, method, body) {
    return fetch('https://api.github.com/repos/' + cfg.repo + '/contents/' + GH_FILE, {
      method,
      headers: { Authorization: 'Bearer ' + cfg.token, Accept: 'application/vnd.github+json' },
      body: body ? JSON.stringify(body) : undefined,
    });
  }

  async pull(cfg) {
    const res = await this.ghFetch(cfg, 'GET');
    /* 404 is the ordinary first run: the repo is there, the file is not. */
    if (res.status === 404) return { sha: null, ...readPayload(null) };
    if (!res.ok) throw new Error('GitHub replied ' + res.status);
    const j = await res.json();
    let parsed = null;
    try { parsed = JSON.parse(this.b64d((j.content || '').replace(/\s/g, ''))); } catch (e) {}
    return { sha: j.sha, ...readPayload(parsed) };
  }

  loadDeleted() { return this.load(DELETED_KEY) || {}; }

  syncNow = async () => {
    const cfg = this.load(SYNC_KEY);
    if (!cfg) return;
    if (this._syncing) { this._syncAgain = true; return; }
    this._syncing = true;
    this.setState({ syncStatus: 'syncing', syncHint: null });
    try {
      /* Twice, not more: one retry covers the other device finishing its own
         write between our read and ours. A loop here would keep two phones
         syncing at each other. */
      for (let attempt = 0; attempt < 2; attempt++) {
        const remote = await this.pull(cfg);
        const deleted = mergeDeleted(this.loadDeleted(), remote.deleted);
        const lots = mergeLots(this.state.lots, remote.lots);
        const notes = mergeNotes(this.state.notes, remote.notes);
        const history = mergeHistory(this.state.history, remote.history, deleted);
        const next = writePayload(lots, notes, history, deleted);

        if (next !== writePayload(remote.lots, remote.notes, remote.history, remote.deleted)) {
          const res = await this.ghFetch(cfg, 'PUT', {
            message: 'Sync from Corkfolio',
            content: this.b64e(next),
            sha: remote.sha || undefined,
          });
          if (res.status === 409 || res.status === 412) continue;
          if (!res.ok) throw new Error('GitHub replied ' + res.status);
        }

        if (lots) this.save('corkfolio.lots.v1', lots);
        this.save('corkfolio.notes.v1', notes);
        this.save(HISTORY_KEY, history);
        this.save(DELETED_KEY, deleted);
        this.setState({
          lots: lots || null, notes, history,
          syncStatus: 'ok', syncHint: null, syncedAt: Date.now(),
        });
        return;
      }
      throw new Error('GitHub replied 409');
    } catch (e) {
      const code = (String(e.message).match(/(\d{3})/) || [])[1];
      const hint =
        code === '401' || code === '403' ? 'the token has likely expired. Create a new one and reconnect'
        : code === '404' ? 'that repo was not found. Check the token has access to it'
        : code === '409' || code === '412' ? 'another device was syncing at the same moment. Tap Sync now to retry'
        : 'no connection, or GitHub is unreachable';
      this.setState({ syncStatus: 'error', syncHint: hint });
    } finally {
      this._syncing = false;
      if (this._syncAgain) { this._syncAgain = false; this.queueSync(); }
    }
  };

  /* Debounced, so an import that changes three things syncs once. */
  queueSync() {
    if (!this.load(SYNC_KEY)) return;
    clearTimeout(this._syncTimer);
    this._syncTimer = setTimeout(this.syncNow, 1500);
  }

  connectSync = async () => {
    const token = (this.state.tokenInput || '').trim();
    const repo = (this.state.repoInput || '').trim()
      .replace(/^https:\/\/github\.com\//, '').replace(/\.git$/, '').replace(/\/$/, '');
    if (!token || repo.indexOf('/') < 0) {
      this.toast('Enter a token and a repo, written as username/corkfolio-data.');
      return;
    }
    const cfg = { token, repo };
    this.setState({ syncStatus: 'syncing' });
    try {
      await this.pull(cfg);
    } catch (e) {
      this.setState({ syncStatus: 'off' });
      this.toast('Could not connect. Check the token and the repo name.');
      return;
    }
    this.save(SYNC_KEY, cfg);
    this.setState({ syncCfg: cfg, showSyncSetup: false, tokenInput: '', repoInput: '' });
    this.syncNow();
  };

  /* Leaves every bottle on the device. Sync is a convenience here, not a
     dependency - the app has never needed it to work. */
  disconnectSync = () => {
    if (!window.confirm('Stop syncing to ' + (this.state.syncCfg || {}).repo + '?\n\n' +
      'The cellar, the history and anything you have written stay on this device. ' +
      'The copy already in the repo stays there too.')) return;
    try { localStorage.removeItem(SYNC_KEY); } catch (e) {}
    this.setState({ syncCfg: null, syncStatus: 'off', syncHint: null });
    this.toast('Sync turned off.');
  };

  /* =============================================================== sheets */

  closeSheet = () => this.setState({ sheet: null, sheetArg: null });

  /* Everything back to the top: the Cellar tab, the whole cellar rather than
     a region, no readiness filter, no search, the in-bond side, and any sheet
     shut. Anything less than all of it leaves you somewhere you did not ask
     to be - a filter still lit, or a search box still holding a word - which
     is worse than not moving at all. */
  goHome = () => this.setState({
    tab: 'cellar', dRegion: null, dSub: null,
    fState: null, fQuery: '', fWhere: 'bond',
    sheet: null, sheetArg: null,
  });

  sheet(title, kids) {
    return h('div', {
      style: sx.sheet,
      onClick: e => { if (e.target === e.currentTarget) this.closeSheet(); },
    }, h('div', { style: sx.sheetInner }, [
      h('div', { key: 'h', style: sx.sheetHead }, [
        h('div', { key: 't', style: { ...sx.title, fontSize: 17 } }, title),
        h('button', { key: 'x', style: btn('plain'), onClick: this.closeSheet }, 'Close'),
      ]),
      h('div', { key: 'b', style: sx.sheetBody }, kids),
    ]));
  }

  renderLotSheet() {
    const lot = this.lots().find(l => l.key === this.state.sheetArg);
    if (!lot) return null;
    const note = this.state.notes[lot.key] || {};
    const y = this.year();
    const win = this.win(lot);
    const state = this.lotState(lot);
    const d = deliveredPerBottle(lot, lot.bottles);
    const mk = marketPerBottle(lot);
    const wine = this.state.ref ? matchWine(lot, this.state.ref.wines) : null;
    const vint = this.state.ref ? matchVintage(lot, this.state.ref.vintages) : null;
    const kids = [];

    /* --- identity ---------------------------------------------------- */
    kids.push(h('div', { key: 'id', style: { flexShrink: 0, display: 'flex', flexDirection: 'column', gap: 6 } }, [
      h('div', {
        key: 'a',
        style: { fontFamily: "'Newsreader',Georgia,serif", fontSize: 25, lineHeight: 1.15, fontWeight: 500 },
      }, lot.vintage + ' ' + (wine ? wine.name : shortName(lot))),
      /* How to say it, on its own line under the name, in the same italic the
         appellation headings use - one visual language for one idea, so it is
         recognised rather than read. Optional by design: an estate an English
         speaker can already say has no `say` field and gets no line, which is
         the rule that keeps the useful ones worth looking at. */
      wine && wine.say ? h('div', {
        key: 'say',
        style: {
          fontFamily: "'Newsreader',Georgia,serif", fontStyle: 'italic',

        },
      }, wine.say) : null,
      h('div', { key: 'b', style: { fontSize: 13, color: ink(0.6) } },
        [wine ? wine.appellation : lot.subRegion, lot.region, wine ? wine.rank : null]
          .filter(Boolean).join(' · ')),
      /* alignItems centre because the Wine-Searcher mark is taller than the
         rest of this row, and a flex row stretches its children by default -
         which turned the maturity pill into a tall rounded box. */
      h('div', { key: 'c', style: { ...sx.chipRow, marginTop: 2, alignItems: 'center' } }, [
        h('span', {
          key: 's', className: 'm-state',
          style: {
            fontSize: 11.5, fontWeight: 600, color: '#fff', background: STATES[state].colour,
            borderRadius: 999, padding: '3px 10px',
          },
        }, STATES[state].name),
        h('span', {
          key: 'w', className: 'm-num',
          style: { fontSize: 11.5, color: ink(0.6), padding: '3px 0' },
        }, win.from
          ? 'window ' + win.from + '–' + win.to +
            ', ' + windowLabel(win)
          : 'no window stated'),
        /* Prices for this exact bottle, at whoever is asking least for it.
           Sits at the right of this row rather than down with the CellarTracker
           button because it answers a different kind of question - what is it
           worth, not what is it like - and this row is where the app's own
           numbers begin. marginLeft auto pushes it right when there is room and
           the row simply wraps when there is not. */
        h('a', {
          key: 'ws',
          href: wineSearcherUrl(lot, wine),
          target: '_blank', rel: 'noopener noreferrer',
          style: { marginLeft: 'auto', display: 'block', lineHeight: 0 },
        }, h(WineSearcherMark, { height: 42 })),
      ]),
    ]));

    /* --- the price that matters -------------------------------------- */
    kids.push(h(Eyebrow, { key: 'e-p' }, 'One bottle, delivered'));
    kids.push(h('div', { key: 'p', style: sx.card }, [
      h('div', {
        key: 'big', className: 'm-num',
        style: { fontFamily: "'Newsreader',Georgia,serif", fontSize: 34, fontWeight: 500, lineHeight: 1 },
      }, d ? money(d.total) : '—'),
      h('div', { key: 'sub', style: { fontSize: 12.5, color: ink(0.6) } },
        'duty paid, VAT paid, out of bond'),
      d ? h('div', {
        key: 'br',
        style: { display: 'flex', flexDirection: 'column', gap: 3, marginTop: 6, fontSize: 12.5 },
      }, reconcileToTotal([
        ['In bond', d.ib],
        ['Duty', d.duty],
        ['VAT at 20%', d.vat],
      ].concat(d.fee ? [['Part-case fee, spread', d.fee]] : []), d.total)
        .map(([label, v]) => h('div', {
          key: label, style: { display: 'flex', justifyContent: 'space-between', gap: 10 },
        }, [
          h('span', { key: 'a', style: { color: ink(0.62) } }, label),
          h('span', { key: 'b', className: 'm-num' }, money(v)),
        ]))) : null,
    ]));

    /* --- the holding -------------------------------------------------- */
    kids.push(h('div', { key: 'nums', style: sx.statRow }, [
      h(Stat, { key: 'a', k: 'Bottles', v: String(lot.bottles) }),
      h(Stat, { key: 'b', k: 'In bond /bt', v: money(perBottle(lot)) }),
      h(Stat, {
        key: 'c', k: marketIsEstimated(lot) ? 'Market est.' : 'Market /bt',
        v: money(marketOrPaid(lot)),
      }),
      h(Stat, {
        key: 'd', k: 'Vs paid',
        /* No mark means the estimate IS the price paid, and "+0%" would read
           as a wine that has not moved rather than one nobody has priced. */
        v: (mk && perBottle(lot)) ? pct(mk / perBottle(lot) - 1) : '—',
        tone: (mk && perBottle(lot) && mk > perBottle(lot)) ? 'var(--st-opening)' : undefined,
      }),
    ]));
    if (win.source === 'researched' && win.basis) {
      kids.push(h('div', { key: 'wbasis', style: sx.note },
        'Drinking window: ' + win.basis));
    } else if (windowIsEstimated(win)) {
      kids.push(h('div', { key: 'wbasis', style: sx.note },
        'The export states no drinking window for this wine, and no published one has been ' +
        'found, so this is an estimate from the vintage and the sub-region. Treat it as a hint.'));
    }

    kids.push(h('div', { key: 'fmt', style: sx.note },
      lot.format + ', ' + lot.volumeCl + 'cl, in cases of ' + (lot.caseSize || '?') +
      (lot.producer ? ' · ' + (note.producer || lot.producer) : '') +
      (lot.status ? ' · ' + lot.status.toLowerCase() : '')));

    /* --- reference notes --------------------------------------------- */
    if (wine) {
      const sections = [
        ['The estate', wine.estate],
        ['Who makes it', wine.producer],
        ['How it tastes', wine.style],
        ['Drinking it', wine.drink],
      ];
      for (const [label, text] of sections) {
        if (!text) continue;
        kids.push(h(Eyebrow, { key: 'e-' + label }, label));
        kids.push(h('p', { key: 'p-' + label, style: sx.prose }, text));
      }
      if (wine.grapes) {
        kids.push(h('div', { key: 'grapes', style: sx.note }, 'Grapes: ' + wine.grapes));
      }
    }

    /* What everybody else thinks, which is the one thing the reference files
       cannot hold. Sits after the estate note and before the vintage, because
       it belongs with opinion rather than with fact - and it is a link out, so
       it should not interrupt anything the app can answer itself. */
    /* The mark sits inside the link rather than beside it: one tap target
       instead of a button next to a picture that does nothing when pressed.
       It also carries the whole explanation. A line underneath used to say
       that this opens CellarTracker and needs a connection, which the logo
       already says and the tab bar of the browser confirms - a caption
       repeating what a mark has just told you is the kind of text people stop
       reading, and then stop reading the useful ones too. */
    kids.push(h('a', {
      key: 'ct',
      href: communityNotesUrl(lot, wine),
      target: '_blank', rel: 'noopener noreferrer',
      style: {
        ...btn('plain'), flexShrink: 0, alignSelf: 'flex-start',
        textDecoration: 'none', display: 'inline-flex', alignItems: 'center', gap: 9,
        marginTop: 2,
      },
    }, [
      h(CellarTrackerMark, { key: 'm', height: 30 }),
      h('span', { key: 'l' }, 'Community tasting notes'),
    ]));

    if (vint) {
      kids.push(h(Eyebrow, { key: 'e-v' }, 'The ' + lot.vintage + ' vintage in ' + lot.region));
      kids.push(h('p', {
        key: 'v-h',
        style: { ...sx.prose, fontStyle: 'italic', color: ink(0.7) },
      }, vint.headline));
      kids.push(h('p', { key: 'v-n', style: sx.prose }, vint.note));
      if (vint.now) kids.push(h('p', { key: 'v-w', style: { ...sx.prose, color: ink(0.72) } }, vint.now));
    }

    if (!wine || !vint) {
      kids.push(h('div', { key: 'gap', style: sx.note },
        this.state.refError ? this.state.refError
          : !wine && !vint ? 'No reference notes for this wine or this vintage yet.'
          : !wine ? 'No reference notes for this estate yet.'
          : 'No notes for this vintage in this region yet.'));
    }


    return this.sheet(lot.vintage, kids);
  }

  /* What has left the cellar. Deliberately plain: a list, newest first, of
     what went and what it had cost by the time it reached the house. No
     market value, because the wine is drunk and a mark on it would be a
     number about something you no longer have. */
  renderHistorySheet() {
    const st = this.state;
    /* Opened from a region page, the sheet shows that region. The line that
       opened it counted a scope, and a sheet that then showed the whole cellar
       would contradict the number just tapped.

       The index into the FULL array is carried through the filter, because
       removing an entry by hand splices the stored list and a position in a
       filtered view would point at the wrong wine. */
    const scoped = st.dRegion || st.dSub;
    const rows = st.history
      .map((e, i) => ({ e, i }))
      .filter(({ e }) => {
        if (st.dRegion && e.region !== st.dRegion) return false;
        if (st.dSub && (e.subRegion || 'Not recognised') !== st.dSub) return false;
        return true;
      });
    const h_ = rows.map(r => r.e);
    const t = {
      bottles: h_.reduce((a, e) => a + e.bottles, 0),
      wines: new Set(h_.map(e => e.key)).size,
      paid: h_.reduce((a, e) => a + (e.paidPerBottle || 0) * e.bottles, 0),
      delivered: h_.reduce((a, e) => a + (e.deliveredPerBottle || 0) * e.bottles, 0),
    };
    const kids = [];
    if (scoped) {
      kids.push(h('div', { key: 'scope', style: sx.note },
        'Showing ' + (st.dSub || st.dRegion) + ' only. The whole cellar is behind the same ' +
        'line on the overview.'));
    }

    const fromHome = h_.filter(e => e.origin === 'home').length;
    kids.push(h('p', { key: 'i', style: sx.prose },
      'Bottles that are out of bond - in a rack waiting, or already drunk. Nothing here counts ' +
      'towards any total in the app, because every total in the app is about what is still in ' +
      'bond.' + (fromHome
        ? ' Most of these come from the home cellar export, which says plainly what is at home. ' +
          'The rest were noticed going missing between two bond exports.'
        : ' They were noticed going missing between two bond exports.')));

    kids.push(h('div', { key: 'nums', style: sx.statRow }, [
      h(Stat, { key: 'a', k: 'Bottles', v: String(t.bottles) }),
      h(Stat, { key: 'b', k: 'Wines', v: String(t.wines) }),
      h(Stat, { key: 'c', k: 'Paid', v: money0(t.paid) }),
      h(Stat, { key: 'd', k: 'Cost delivered', v: money0(t.delivered) }),
    ]));

    kids.push(h(Eyebrow, { key: 'e' }, 'Most recent first'));

    /* Newest first for reading, but the index has to point back into the
       stored order, which is oldest first - so it is carried, not recomputed
       from the reversed list. */
    const ordered = rows.slice().reverse();
    kids.push(...ordered.map(({ e, i }) => h('div', {
      key: e.key + '-' + e.at + '-' + i,
      style: { ...sx.panel, gap: 4 },
    }, [
      h('div', { key: 't', style: sx.rowTitle }, e.vintage + ' ' + shortName(e)),
      h('div', { key: 'm', style: sx.rowMeta }, [
        h('span', { key: 'a' }, e.subRegion || e.region),
        h('span', { key: 'b', className: 'm-num' },
          e.bottles + (e.bottles === 1 ? ' bottle' : ' bottles') + (e.full ? ', the last of them' : '')),
        h('span', { key: 'c' },
          e.origin === 'home' ? 'from the home export' : 'left ' + whenLeft(e.at)),
      ]),
      h('div', { key: 'p', style: { ...sx.rowMeta, marginTop: 2 } }, [
        h('span', { key: 'a', className: 'm-num' },
          e.paidPerBottle ? money(e.paidPerBottle) + ' a bottle in bond' : 'price paid unknown'),
        e.deliveredPerBottle ? h('span', { key: 'b', className: 'm-num' },
          money(e.deliveredPerBottle) + ' delivered') : null,
      ]),
      h('button', {
        key: 'x',
        style: { ...btn('plain'), alignSelf: 'flex-start', marginTop: 4, fontSize: 12 },
        onClick: () => this.forgetHistory(i),
      }, 'Never left - remove'),
    ])));

    return this.sheet('Home and consumed', kids);
  }

  renderSettingsSheet() {
    const st = this.state;
    const kids = [];
    const lots = this.lots();

    kids.push(h(Eyebrow, { key: 'e-c' }, 'The cellar'));
    if (st.localFile) {
      kids.push(h('button', {

        : 'The “my-home-cellar-view” export lists what is at home rather than in bond. It goes ' +
          'straight to Home and consumed and counts towards no total in the app.'));

    const cov = this.coverage();
    if (cov.ready && lots.length) {
      kids.push(h(Eyebrow, { key: 'e-cov' }, 'Reference coverage'));
      if (cov.complete) {
        kids.push(h('div', { key: 'covok', style: sx.note },
          'Every wine in the cellar has an estate note, a vintage note and a recognised ' +
          'appellation, and every region has an essay and a map.'));
      } else {
        const line = (n, what) => n ? n + ' ' + what : null;
        kids.push(h('div', { key: 'covgaps', style: { ...sx.note, borderLeftColor: CLARET } },
          'Missing: ' + [
            line(cov.noEstate.length, 'without an estate note'),
            line(cov.noVintage.length, 'region-vintages undescribed'),
            line(cov.noRegion.length, 'regions with no essay'),
            line(cov.noMap.length, 'regions with no map'),
